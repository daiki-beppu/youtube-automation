function costBlock(d, { compact = false } = {}) {

    return `<span><b>${esc(ENGINE_JA[k] || k)}</b></span><span class="cost-bar${over ? " over" : ""}"><i style="width:${Math.min(100, est / cap * 100)}%"></i></span><span class="mono">${over ? '<span class="status-chip status-fail">上限超過</span> ' : ""}${est} / ${cap} ${UNIT[k]}${act !== undefined ? `（実績 ${act}）` : ""} ${usd}</span>`;

  return `${d.state.design.status === "approved" ? `<section class="view-card view-summary"><h2>進み具合</h2>${progressLine(d)}</section>` : ""}${esc_}
  ${d.showProposals ? `<section class="view-card view-summary"><h2>まず案を選んでください</h2><p class="hint">推奨案を選ぶと下の設計書がそのまま本設計になります。代替案は推奨案と 1 点だけ変えてあります。</p>${proposalPicker(d, "proposal-row")}</section>` : ""}
  <section class="view-card"><h2>設計書</h2><p class="legend">値の出どころ: <span class="src src-interview">自分で決めた</span><span class="src src-recommended">推奨で埋めた</span><span class="src src-config">チャンネル設定</span><span class="src src-analytics">分析結果</span></p>
    ${sec("第 1 条 企画", planRows(d))}${sec("第 2 条 音楽", musicRows(d))}${sec("第 3 条 サムネイル", thumbRows(d))}${sec("第 4 条 動画", videoRows(d))}${sec("第 5 条 ショート", shortsRows(d))}${sec("第 6 条 公開", publishRows(d))}
    <section class="clause"><h3>第 7 条 コストと上限</h3>${costBlock(d)}</section>
    <section class="clause"><h3>付記 チャンネル共通設定の束縛</h3><p class="hint mono">${Object.entries(d.design.config_digest).map(([f, h]) => `${f}: ${h}`).join(" · ")}</p></section>
  </section>
  ${d.state.design.status !== "approved" ? `<div class="sign-footer"><h2 style="margin:0 0 var(--space-xs)">上記の内容で制作を開始します</h2>${approveForm(d)}<details class="fold" style="margin-block-start:var(--space-sm)"><summary>修正を依頼する</summary><div class="fold-body">${reviseForm()}</div></details></div>` : ""}`;
}

// =====================================================================
// Variant B: 要約先行（hero に要点と承認、詳細は折りたたみ、左に目次）
// =====================================================================
function VariantB(d) {
  header(d, "案 B: 要約先行");
  document.body.className = "vb";
  const p = d.design.plan, c = d.design.cost;
  const costOne = Object.keys(c.cap).map(k => `${ENGINE_JA[k].split("（")[0]} ${c.estimate[k] ?? 0}/${c.cap[k]}${UNIT[k]}`).join(" · ");
  const hero = `<section class="hero" id="top">
    <div class="hero-facts">
      <div class="fact"><b>タイトル</b><span class="big">${esc(p.title.ja)}</span></div>
      <div class="fact"><b>何を作る</b><span>${esc(d.design.music.track_count)} 曲の ${esc(p.genre)}（歌なし）→ 3 時間動画 + ショート ${d.design.shorts.count} 本</span></div>
      <div class="fact"><b>いつ公開</b><span>${esc(d.design.publish.publish_at.replace("T", " ").slice(0, 16))} / ${esc(d.design.publish.privacy_status)}</span></div>
      <div class="fact"><b>使う上限</b><span>${d.overCap ? '<span class="status-chip status-fail">上限超過</span> ' : ""}${esc(costOne)}</span></div>
      <div class="fact"><b>自分で決めた</b><span>${d.decisions.map(x => esc(x.decision)).join(" / ")}<span class="muted">（残りは推奨とチャンネル設定）</span></span></div>
    </div>
    <div><img class="preview-img" src="${d.proposals[0]?.img || svgThumb("#274060", "#f5c26b", "雨の夜の", "Lo-fi Jazz")}" alt=""><p class="hint" style="margin-block-start:var(--space-2xs)">サムネイルの目安（承認前のプレビュー）</p></div>
    <div class="hero-actions">${d.state.design.status === "approved" ? progressLine(d) : `${approveForm(d, { label: "承認して制作を始める" })}<details class="fold"><summary>気になる所がある → 修正を依頼</summary><div class="fold-body">${reviseForm()}</div></details>`}</div>
  </section>`;
  const sect = (id, title, sub, body, open = false) => `<details class="sect" id="${id}" ${open ? "open" : ""}><summary><span>${title}</span><span class="sub">${sub}</span></summary>${body}</details>`;
  const toc = `<nav class="toc" aria-label="目次"><p class="eyebrow">目次</p><ol><li><a href="#top">要点と承認</a></li>${d.escalations.length ? `<li><a href="#esc">⚠ 確認待ち ${d.escalations.length} 件</a></li>` : ""}${d.showProposals ? `<li><a href="#props">案を比べる</a></li>` : ""}${Object.entries(SECTION_JA).map(([k, v]) => `<li><a href="#s-${k}">${v}</a></li>`).join("")}</ol></nav>`;
  return `<div class="layout">${toc}<div style="display:grid;gap:var(--space-md)">
    ${d.escalations.length ? `<div id="esc">${d.escalations.map(v => escalationBlock(d, v)).join("")}</div>` : ""}
    ${hero}
    ${d.showProposals ? `<section class="view-card" id="props"><h2>別の案も見る</h2><p class="hint">上の要点は推奨案のものです。切り替えると要点も差し替わります。</p>${proposalPicker(d, "proposals")}</section>` : ""}
    <p class="legend">詳細の値の出どころ: <span class="src src-interview">自分で決めた</span><span class="src src-recommended">推奨で埋めた</span><span class="src src-config">チャンネル設定</span><span class="src src-analytics">分析結果</span></p>
    ${sect("s-plan", "企画", esc(p.theme + " / " + p.genre), `<dl>${planRows(d)}</dl>`)}
    ${sect("s-music", "音楽", `${d.design.music.track_count} 曲 · ${esc(ENGINE_JA[d.design.music.engine])}`, `<dl>${musicRows(d)}</dl>`)}
    ${sect("s-thumbnail", "サムネイル", esc(d.design.thumbnail.text.lines.join(" / ")), `<dl>${thumbRows(d)}</dl>`)}
    ${sect("s-video", "動画", `ループ ${d.design.video.background.duration_sec} 秒 · ${esc(d.design.video.resolution)}`, `<dl>${videoRows(d)}</dl>`)}
    ${sect("s-shorts", "ショート", `${d.design.shorts.count} 本`, `<dl>${shortsRows(d)}</dl>`)}
    ${sect("s-publish", "公開", esc(d.design.publish.publish_at.slice(0, 10)), `<dl>${publishRows(d)}</dl>`)}
    ${sect("s-cost", "コストと上限", d.overCap ? "上限超過" : "上限内", costBlock(d), d.overCap)}
  </div></div>`;
}

// =====================================================================
// Variant C: 工程タイムライン（工程ごとに確認 → 全チェックで承認）
// =====================================================================
const C_STEPS = [["plan", "企画"], ["music", "音楽"], ["thumbnail", "サムネイル"], ["video", "動画"], ["shorts", "ショート"], ["publish", "公開"], ["cost", "コスト"]];
let cActive = "plan"; const cAck = new Set();
function VariantC(d) {
  header(d, "案 C: 工程タイムライン");
  document.body.className = "vc";
  const approved = d.state.design.status === "approved";
  const assetOf = { music: d.state.assets.music, thumbnail: d.state.assets.thumbnail, video: d.state.assets.loop_video, shorts: d.state.assets.shorts, publish: d.state.assets.upload };
  const escFor = k => d.escalations.filter(v => v.design_section === k);
  const steps = `<ol class="steps">${C_STEPS.map(([k, ja], i) => `<li><button data-step="${k}" class="${k === cActive ? "active" : ""} ${approved ? (assetOf[k] === "done" ? "done" : escFor(k).length ? "dev" : "") : (cAck.has(k) ? "done" : "")}"><span class="n">STEP ${i + 1}</span><span>${ja}</span><span class="s">${approved ? ({ done: "完了", running: "生成中", escalated: "確認待ち", waiting: "未着手" }[assetOf[k]] || "") : (cAck.has(k) ? "確認済み" : "未確認")}</span></button></li>`).join("")}</ol>`;
  const bodies = { plan: planRows(d), music: musicRows(d), thumbnail: thumbRows(d), video: videoRows(d), shorts: shortsRows(d), publish: publishRows(d) };
  const previews = { plan: `<img class="preview-img" src="${d.proposals[0]?.img || svgThumb("#274060", "#f5c26b", "雨の夜の", "Lo-fi Jazz")}" alt=""><p class="hint">案のイメージ画像（承認前プレビュー）</p>`, thumbnail: `<img class="preview-img" src="${svgThumb("#274060", "#f5c26b", "雨の夜の", "Lo-fi Jazz")}" alt=""><p class="hint">${approved ? "生成された候補" : "まだ作っていません。文字と構図は左のとおりに作ります"}</p>`, music: `<div class="copyable-content">${esc(d.design.music.prompts[0].style)}</div><p class="hint">1 曲目の指示文の例。音源は承認後に作ります</p>`, video: `<div class="preview-img" style="display:grid;place-items:center;color:var(--color-ink-muted)">ループ動画 ${d.design.video.background.duration_sec} 秒（承認後に生成）</div>`, shorts: `<p class="hint">サビ相当の 30 秒を ${d.design.shorts.count} 本切り出します。区間は自動で選びます</p>`, publish: `<p class="hint">承認後、公開日時になったら自動で公開・プレイリスト追加・固定コメント投稿まで行います（人の確認はありません）</p>` };
  const idx = C_STEPS.findIndex(([k]) => k === cActive);
  const stage = cActive === "cost" ? `<div class="stage"><div class="full"><h2>コストと上限</h2>${costBlock(d)}</div></div>` : `<div class="stage"><div><h2>${SECTION_JA[cActive]}</h2><p class="legend"><span class="src src-interview">自分で決めた</span><span class="src src-recommended">推奨で埋めた</span><span class="src src-config">チャンネル設定</span></p><dl>${bodies[cActive]}</dl></div><div>${previews[cActive]}</div>${escFor(cActive).map(v => `<div class="full">${escalationBlock(d, v)}</div>`).join("")}${!approved ? `<label class="ack full"><input type="checkbox" data-ack="${cActive}" ${cAck.has(cActive) ? "checked" : ""}> この工程の内容を確認した</label>` : ""}</div>`;
  const nav = `<div class="stage-nav"><button class="secondary" data-go="${idx - 1}" ${idx === 0 ? "disabled" : ""}>← 前の工程</button><span class="muted">${idx + 1} / ${C_STEPS.length}</span><button data-go="${idx + 1}" ${idx === C_STEPS.length - 1 ? "disabled" : ""}>次の工程 →</button></div>`;
  const allAck = C_STEPS.filter(([k]) => k !== "cost").every(([k]) => cAck.has(k));
  const final = approved ? `<section class="final"><h2 style="margin:0">進み具合</h2>${progressLine(d)}${d.escalations.length ? `<p class="hint">確認待ちの工程は上のタブに「!」が付いています。</p>` : ""}</section>` : `<section class="final"><h2 style="margin:0">承認</h2><p class="hint">${allAck ? "すべての工程を確認しました。" : `未確認の工程: ${C_STEPS.filter(([k]) => k !== "cost" && !cAck.has(k)).map(([, ja]) => ja).join("、")}`}</p>${allAck ? approveForm(d) : `<div class="action-row"><button disabled>承認（全工程を確認すると押せます）</button></div>`}<details class="fold"><summary>修正を依頼する</summary><div class="fold-body">${reviseForm()}</div></details></section>`;
  return `${d.showProposals ? `<section class="view-card view-summary"><h2>まず案を選ぶ</h2>${proposalPicker(d, "proposals")}</section>` : ""}${d.escalations.length && cActive !== "thumbnail" ? `<section class="approval-summary approval-fail"><b>確認待ちが ${d.escalations.length} 件</b> — <a href="#" data-step="thumbnail" style="color:var(--color-link)">サムネイルの工程で確認する</a>${progressLine(d)}</section>` : ""}${steps}${stage}${nav}${final}`;
}

// =====================================================================
// 切替（試作専用）
// =====================================================================
const VARIANTS = { A: ["契約書", VariantA], B: ["要約先行", VariantB], C: ["工程タイムライン", VariantC] };
const keys = Object.keys(VARIANTS);
let mem = null; // data: / file: で history が使えない環境用のフォールバック
function current() { if (mem) return mem; const u = new URL(location.href); return { v: keys.includes(u.searchParams.get("variant")) ? u.searchParams.get("variant") : "A", s: u.searchParams.get("state") || "review" }; }
function setParams(v, s) { mem = { v, s }; try { const u = new URL(location.href); u.searchParams.set("variant", v); u.searchParams.set("state", s); history.replaceState(null, "", u); } catch (_) {} render(); }
function render() {
  const { v, s } = current(); const d = dataFor(s);
  document.getElementById("app").innerHTML = VARIANTS[v][1](d);
  document.getElementById("vlabel").textContent = `${v} (${VARIANTS[v][0]})`;
  document.getElementById("state").value = s;
  document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); cActive = b.dataset.step; render(); }));
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { cActive = C_STEPS[+b.dataset.go][0]; render(); window.scrollTo({ top: 0 }); }));
  document.querySelectorAll("[data-ack]").forEach(i => i.addEventListener("change", () => { i.checked ? cAck.add(i.dataset.ack) : cAck.delete(i.dataset.ack); render(); }));
  document.querySelectorAll("form").forEach(f => f.addEventListener("submit", e => { e.preventDefault(); const fd = new FormData(f); const btn = e.submitter; if (btn?.name) fd.set(btn.name, btn.value); alert(`PROTOTYPE: ${f.method.toUpperCase()} ${f.getAttribute("action")}\n` + [...fd.entries()].map(([k, v]) => `${k} = ${v}`).join("\n")); }));
}
document.getElementById("prev").onclick = () => { const { v, s } = current(); setParams(keys[(keys.indexOf(v) + keys.length - 1) % keys.length], s); };
document.getElementById("next").onclick = () => { const { v, s } = current(); setParams(keys[(keys.indexOf(v) + 1) % keys.length], s); };
document.getElementById("state").onchange = e => { const { v } = current(); setParams(v, e.target.value); };
document.addEventListener("keydown", e => { if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return; if (e.key === "ArrowLeft") document.getElementById("prev").click(); if (e.key === "ArrowRight") document.getElementById("next").click(); });
render();
</script>
</body>
</html>
