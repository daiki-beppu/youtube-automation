[tool.hatch.build.targets.wheel]
packages = ["src/youtube_automation"]

[tool.hatch.build.targets.wheel.force-include]
# BGM チャンネル運営方針テンプレ (CLAUDE.md) を _claude_md/ として同梱
# (yt-skills sync --asset claude-md が importlib.resources で参照する)
".claude/CLAUDE.template.md" = "youtube_automation/_claude_md/CLAUDE.template.md"
# workflow チートシート / 全 skill カタログを _docs/ として同梱
# (yt-skills sync --asset workflow-cheatsheet / features が importlib.resources で参照する)
# 配布された SKILL.md / CLAUDE.md の相対 link が install 版と同 version の docs/ を指せる
"docs/workflow-cheatsheet.md" = "youtube_automation/_docs/workflow-cheatsheet.md"
"docs/features.md" = "youtube_automation/_docs/features.md"
"src/youtube_automation/infrastructure/resources/auth/client_secrets.template.json" = "youtube_automation/infrastructure/resources/auth/client_secrets.template.json"
".claude/settings.template.json" = "youtube_automation/_claude_settings/settings.template.json"

# templates/*.md はパッケージディレクトリ内なので packages 設定で同梱される

[tool.hatch.build.targets.sdist]
skip-excluded-dirs = true
ignore-vcs = true
only-include = [
    "src/",
    "tests/",
    ".claude/CLAUDE.template.md",
    ".claude/settings.template.json",
    "docs/workflow-cheatsheet.md",
    "docs/features.md",
    # README の OAuth 導線（ONBOARDING → oauth-setup → oauth-scopes / ルート B 詳細）が
    # sdist 内で解決するよう同梱する。infra/ はこの README 以外は配布しない
    "ONBOARDING.md",
    "docs/oauth-setup.md",
    "docs/oauth-scopes.md",
    "infra/terraform/gcp/README.md",
    "README.md",
    "LICENSE",
    "hatch_build.py",
    "pyproject.toml",
]

[tool.hatch.build.targets.sdist.force-include]
"src/youtube_automation/dashboard_dist" = "src/youtube_automation/dashboard_dist"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
# runtime fallback の _DEV_ONLY_SKILL_NAMES と契約テストで一致を担保する。
dev-only-skills = ["automation-release", "shadcn"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "RUF"]
# RUF001/002/003: 日本語コードベースのため全角文字の ambiguous-unicode 検知は誤検知のみ
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# pytest.raises(match=...) の正規表現メタ文字警告はテスト可読性を優先して抑制
"tests/**" = ["RUF043"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "failed"
markers = [
    "repo_contract: static repository, documentation, CI, workflow, or packaging contract",
    "slow: intentional wait or external tool/process integration unsuitable for the behavioral fast lane",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15,<1",
]
