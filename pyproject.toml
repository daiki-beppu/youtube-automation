[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "youtube-channels-automation"
version = "5.6.0"
description = "YouTube channel automation toolkit - analytics, AI content generation, and auto-upload"
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "daiki-beppu"}]
dependencies = [
    "google-api-python-client>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "google-auth-httplib2>=0.3,<1",
    "google-genai>=2,<3",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "Pillow>=12.2.0,<13",
    "pandas>=3,<4",
    "matplotlib>=3,<4",
    "japanize-matplotlib>=1,<2",
    "schedule>=1,<2",
    # japanize-matplotlib 1.1.3 imports distutils at runtime; Python >=3.12
    # removed it from stdlib, while setuptools provides the documented shim.
    "setuptools>=83,<84",
    "pyyaml>=6,<7",
    "requests>=2,<3",
    "fastjsonschema>=2.21,<3",
    "boto3>=1.40,<2",
]

[project.urls]
Repository = "https://github.com/daiki-beppu/youtube-automation"

