name: Terraform drift

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/gcp/**'
      - '.github/workflows/terraform-drift.yml'
      - '.github/scripts/terraform-drift.sh'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-drift
  cancel-in-progress: false

jobs:
  drift:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_project_id: ${{ secrets.TF_VAR_project_id }}
      TF_VAR_billing_account: ${{ secrets.TF_VAR_billing_account }}
      TF_VAR_adc_email: ${{ secrets.TF_VAR_adc_email }}
      TF_VAR_github_repository_owner_id: ${{ secrets.TF_VAR_github_repository_owner_id }}
      TF_VAR_tfstate_bucket: ${{ secrets.TFSTATE_BUCKET }}
      TFSTATE_BUCKET: ${{ secrets.TFSTATE_BUCKET }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DRIFT_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - run: bash "$GITHUB_WORKSPACE/.github/scripts/terraform-drift.sh"
        working-directory: infra/terraform/gcp
