name: CI

on:
  push:
    branches: [main]
  pull_request: {}

# main への push は cancel-in-progress の対象外（デプロイ相当の run を途中で殺さない）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.classify.outputs.python }}
      packaging: ${{ steps.classify.outputs.packaging }}
      windows: ${{ steps.classify.outputs.windows }}
      adr: ${{ steps.classify.outputs.adr }}
      test_plan: ${{ steps.test-plan.outputs.plan }}
      test_execution: ${{ steps.test-plan.outputs.execution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            separator="..."
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
            separator=".."
          fi
          case "$base" in
            "" | 0000000000000000000000000000000000000000)
              base="${head}^"
              separator=".."
              ;;
          esac
          git diff --name-only "${base}${separator}${head}" > "$RUNNER_TEMP/changed-paths.txt"
          bash .github/scripts/classify-ci-paths.sh "$RUNNER_TEMP/changed-paths.txt" | tee -a "$GITHUB_OUTPUT"
      - name: Build affected-test plan
        id: test-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          plan=$(python .github/scripts/select-affected-tests.py --format json "$RUNNER_TEMP/changed-paths.txt")
          printf 'plan=%s\n' "$plan" >> "$GITHUB_OUTPUT"
          mode=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["mode"])' "$plan")
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$mode" = "selected" ]; then
            echo "execution=selected" >> "$GITHUB_OUTPUT"
          else
            echo "execution=full" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: No Python lint required
        if: needs.changes.outputs.python != 'true'
        run: echo "Extension-only change; Python lint is not applicable."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.python == 'true'
        with:
          # pyscn 差分ゲートが base commit を worktree へ展開するため全履歴が必要
          fetch-depth: 0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        if: needs.changes.outputs.python == 'true'
      - name: Cache uv
        if: needs.changes.outputs.python == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - if: needs.changes.outputs.python == 'true'
        run: nix develop --command uv sync
      - parallel:
          - name: Ruff check
            if: needs.changes.outputs.python == 'true'
            run: nix develop --command uv run ruff check .
          - name: Ruff format check
            if: needs.changes.outputs.python == 'true'
            run: nix develop --command uv run ruff format --check .
          - name: pyscn check
            if: needs.changes.outputs.python == 'true'
            run: nix develop --command uv run pyscn check src/youtube_automation
      - name: pyscn new-only diff gate
        if: needs.changes.outputs.python == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          case "$base" in
            "" | 0000000000000000000000000000000000000000)
              base="$(git rev-parse HEAD^)"
              ;;
          esac
          PYSCN_DIFF_BASE="$base" nix develop --command uv run python .github/scripts/pyscn-diff-gate.py
  test-selected:
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.test_execution == 'selected'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop --command uv sync
      - name: Selected tests
        env:
          TEST_PLAN_JSON: ${{ needs.changes.outputs.test_plan }}
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/affected-test-plan.txt"
          python - <<'PY' > "$plan_file"
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["TEST_PLAN_JSON"])
          if set(payload) != {"mode", "targets"}:
              raise SystemExit("invalid affected-test plan keys")
          mode = payload["mode"]
          targets = payload["targets"]
          if mode == "all":
              if targets != []:
                  raise SystemExit("ALL plan must not contain targets")
          elif mode == "selected":
              if not isinstance(targets, list) or not targets:
                  raise SystemExit("selected plan must contain targets")
              if any(
                  not isinstance(target, str)
                  or not target.startswith("tests/")
                  or "\n" in target
                  or not Path(target).is_file()
                  for target in targets
              ):
                  raise SystemExit("selected plan contains an unsafe target")
          else:
              raise SystemExit("invalid affected-test plan mode")
          print(mode)
          print(*targets, sep="\n")
          PY
          mapfile -t plan_lines < "$plan_file"
          targets=("${plan_lines[@]:1}")
          total_count=$(python - <<'PY'
          from pathlib import Path

          print(
              sum(
                  1
                  for path in Path("tests").rglob("*.py")
                  if path.name.startswith("test_") or path.name.endswith("_test.py")
              )
          )
          PY
          )
          echo "Selected pytest targets: ${#targets[@]}/${total_count}"
          nix develop --command uv run pytest -n auto -- "${targets[@]}"

  test-behavioral:
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.test_execution == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop --command uv sync
      - name: Behavioral tests
        run: nix develop --command uv run pytest -n auto -m "not repo_contract and not slow"

  test-repository-contract:
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.test_execution == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop --command uv sync
      - name: Repository contract tests
        run: nix develop --command uv run pytest -n auto -m "repo_contract and not slow"

  test-slow:
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.test_execution == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop --command uv sync
      - name: Slow tests
        run: nix develop --command uv run pytest -n auto -m slow

  # branch protection の required check 名を維持し、selected/full/extension-only の
  # いずれでも実行された lane の成功だけを集約する。
  test:
    needs: [changes, test-selected, test-behavioral, test-repository-contract, test-slow]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify test lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          TEST_EXECUTION: ${{ needs.changes.outputs.test_execution }}
          SELECTED_RESULT: ${{ needs.test-selected.result }}
          BEHAVIORAL_RESULT: ${{ needs.test-behavioral.result }}
          REPOSITORY_CONTRACT_RESULT: ${{ needs.test-repository-contract.result }}
          SLOW_RESULT: ${{ needs.test-slow.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes job did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [ "$PYTHON_CHANGED" != "true" ]; then
            echo "Python tests are not applicable."
          elif [ "$TEST_EXECUTION" = "selected" ]; then
            test "$SELECTED_RESULT" = "success"
          elif [ "$TEST_EXECUTION" = "full" ]; then
            test "$BEHAVIORAL_RESULT" = "success"
            test "$REPOSITORY_CONTRACT_RESULT" = "success"
            test "$SLOW_RESULT" = "success"
          else
            echo "Unknown test execution mode: $TEST_EXECUTION" >&2
            exit 1
          fi

  build-smoke:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Frozen sync (lock drift check)
        run: nix develop --command uv sync --frozen
      - name: Build wheel and sdist
        run: nix develop --command uv build
      - name: Smoke test installed wheel downstream sync
        run: |
          candidate_wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$candidate_wheel"
          YTA_CANDIDATE_WHEEL="$candidate_wheel" \
            nix develop --command uv run pytest tests/repo/test_skills_sync_installed_wheel.py -q
      - name: Smoke test installed wheel dashboard
        run: |
          candidate_wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$candidate_wheel"
          YTA_CANDIDATE_WHEEL="$candidate_wheel" \
            nix develop --command uv run pytest tests/repo/test_dashboard_packaging.py -q

  windows-cost-tracker:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install dependencies
        run: uv sync
      - name: Test cost tracker on Windows
        run: uv run pytest tests/infrastructure/test_cost_tracker.py -q
      - name: Test collection serve import on Windows
        run: uv run pytest tests/commands/collections/test_collection_serve.py::test_module_import_succeeds_without_fcntl -q

  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check CHANGELOG update
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          if [[ ",${PR_LABELS}," == *",skip-changelog,"* ]]; then
            echo "skip-changelog label present, skipping CHANGELOG check"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"
          if [[ "$HEAD_REF" == release/* ]]; then
            if ! echo "$changed" | grep -q '^CHANGELOG\.md$'; then
              echo "::error::Release PRs must update CHANGELOG.md."
              exit 1
            fi
            echo "Release CHANGELOG update found"
            exit 0
          fi
          if echo "$changed" | grep -q '^CHANGELOG\.md$'; then
            echo "::error::Normal PRs must not edit CHANGELOG.md directly; add a fragment under changelog.d/."
            exit 1
          fi
          if ! echo "$changed" | grep -qE '^(src/youtube_automation/|\.claude/skills/|\.claude/CLAUDE\.template\.md$|pyproject\.toml$)'; then
            echo "No significant code changes, skipping CHANGELOG check"
            exit 0
          fi
          if ! echo "$changed" | grep -qE '^changelog\.d/.+\.md$'; then
            echo "::error::Add a changelog fragment under changelog.d/, or apply 'skip-changelog' label."
            exit 1
          fi
          echo "Changelog fragment found"
      # fragment の存在だけでなく、release prepare が要求する type 文字列と bullet 体裁も
      # PR 時点で検証する。ラベルや path filter に関係なく changelog.d/ 全件を対象にする。
      - name: Validate changelog fragments
        run: python .github/scripts/validate-changelog-fragments.py

  adr-numbering:
    needs: changes
    if: needs.changes.outputs.adr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check ADR number uniqueness
        run: |
          set -eu
          dups=$(ls docs/adr | cut -d- -f1 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Duplicate ADR numbers found: $dups"
            ls docs/adr | sort
            exit 1
          fi
          echo "ADR numbers are unique"

  any-gate:
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check new Any usage
        env:
          PRE_PUSH_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/any-usage-gate.sh
