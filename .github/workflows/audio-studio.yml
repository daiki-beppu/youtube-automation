name: Audio Studio

on:
  push:
    branches: [main]
    paths:
      - "audio-studio/**"
      - "src/youtube_automation/audio_studio_dist/**"
      - "src/youtube_automation/commands/media/audio_studio.py"
      - "src/youtube_automation/infrastructure/localserver/**"
      - ".github/workflows/audio-studio.yml"
      - ".node-version"
  pull_request:
    paths:
      - "audio-studio/**"
      - "src/youtube_automation/audio_studio_dist/**"
      - "src/youtube_automation/commands/media/audio_studio.py"
      - "src/youtube_automation/infrastructure/localserver/**"
      - ".github/workflows/audio-studio.yml"
      - ".node-version"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          run-install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          git -C .. diff --exit-code -- src/youtube_automation/audio_studio_dist
