name: Release notes site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/release-notes/**"
      - ".github/workflows/site.yml"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    paths:
      - "site/**"
      - "docs/release-notes/**"
      - ".github/workflows/site.yml"
      - "flake.nix"
      - "flake.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Install dependencies
        run: nix develop .#extensions --command pnpm -C site install --frozen-lockfile
      - name: Check content and types
        run: nix develop .#extensions --command pnpm -C site check
      - name: Test
        run: nix develop .#extensions --command pnpm -C site test
      - name: Build
        run: nix develop .#extensions --command pnpm -C site build
