name: Release notes site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".claude/skills/**"
      - "docs/release-notes/**"
      - "ONBOARDING.md"
      - "docs/tool-setup.md"
      - "docs/oauth-setup.md"
      - "docs/oauth-scopes.md"
      - "docs/features.md"
      - "docs/workflow-cheatsheet.md"
      - "docs/chrome-extension-install-guide.md"
      - "docs/dashboard.md"
      - "docs/cloud-execution.md"
      - "docs/live-streaming.md"
      - "docs/streaming-healthcheck.md"
      - "docs/live-chat-reply.md"
      - "docs/ambient-layers.md"
      - "docs/scheduled-publish.md"
      - "docs/localizations.md"
      - "docs/distrokid.md"
      - "docs/audio-studio.md"
      - "docs/review-viewers.md"
      - "docs/migration/high-cpm-locales.md"
      - "docs/upgrades/v5.4.0.md"
      - "docs/upgrades/v5.5.0.md"
      - "docs/upgrades/v5.5.1.md"
      - "docs/upgrades/v6.0.0.md"
      - ".github/workflows/site.yml"
      - ".node-version"
  pull_request:
    paths:
      - "site/**"
      - ".claude/skills/**"
      - "docs/release-notes/**"
      - "ONBOARDING.md"
      - "docs/tool-setup.md"
      - "docs/oauth-setup.md"
      - "docs/oauth-scopes.md"
      - "docs/features.md"
      - "docs/workflow-cheatsheet.md"
      - "docs/chrome-extension-install-guide.md"
      - "docs/dashboard.md"
      - "docs/cloud-execution.md"
      - "docs/live-streaming.md"
      - "docs/streaming-healthcheck.md"
      - "docs/live-chat-reply.md"
      - "docs/ambient-layers.md"
      - "docs/scheduled-publish.md"
      - "docs/localizations.md"
      - "docs/distrokid.md"
      - "docs/audio-studio.md"
      - "docs/review-viewers.md"
      - "docs/migration/high-cpm-locales.md"
      - "docs/upgrades/v5.4.0.md"
      - "docs/upgrades/v5.5.0.md"
      - "docs/upgrades/v5.5.1.md"
      - "docs/upgrades/v6.0.0.md"
      - ".github/workflows/site.yml"
      - ".node-version"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          run-install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check content and types
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
