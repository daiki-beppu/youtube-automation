name: Release Extensions

# tag push 時に各 Chrome 拡張をビルドして zip を生成し、単一の GitHub Release に添付する。
# tag 命名は拡張バージョン用の `ext-v*`（Python 本体の release タグと分離する）。
on:
  push:
    tags:
      - "ext-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - parallel:
          - name: Build and zip suno-helper
            working-directory: extensions/suno-helper
            run: cd ../.. && bash .claude/skills/automation-release/references/verify-extensions.sh suno-helper
          - name: Build and zip distrokid-helper
            working-directory: extensions/distrokid-helper
            run: cd ../.. && bash .claude/skills/automation-release/references/verify-extensions.sh distrokid-helper
          - name: Build and zip community-helper
            working-directory: extensions/community-helper
            run: cd ../.. && bash .claude/skills/automation-release/references/verify-extensions.sh community-helper
      - name: Attach zips to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            extensions/suno-helper/.output/*.zip
            extensions/distrokid-helper/.output/*.zip
            extensions/community-helper/.output/*.zip
          body: |
            ## 収録拡張

            - **Suno Helper** — `suno-helper-*.zip`
            - **DistroKid Helper** — `distrokid-helper-*.zip`
            - **Community Helper** — `community-helper-*.zip`

            ## インストール・更新

            `/extension` skill を正規入口として使うと、各拡張の状態から install / update / skip が自動判定されます。
            Chrome で必要な操作と手動取得のフォールバックは[Chrome 拡張インストールガイド](https://youtube-automation-release-notes.pages.dev/chrome-extension-install-guide/)を参照してください。
