name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "src/youtube_automation/dashboard_dist/**"
      - "src/youtube_automation/commands/analytics/dashboard.py"
      - "src/youtube_automation/infrastructure/analytics/channel_registry.py"
      - "src/youtube_automation/infrastructure/analytics/dashboard_read_model.py"
      - ".github/workflows/dashboard.yml"
      - ".node-version"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    paths:
      - "dashboard/**"
      - "src/youtube_automation/dashboard_dist/**"
      - "src/youtube_automation/commands/analytics/dashboard.py"
      - "src/youtube_automation/infrastructure/analytics/channel_registry.py"
      - "src/youtube_automation/infrastructure/analytics/dashboard_read_model.py"
      - ".github/workflows/dashboard.yml"
      - ".node-version"
      - "flake.nix"
      - "flake.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          run-install: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python dependencies
        run: nix develop --command uv sync --frozen
      - name: Install dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: dashboard
        run: pnpm exec playwright install --with-deps chromium
      - name: Frontend checks
        working-directory: dashboard
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          git -C .. diff --exit-code -- src/youtube_automation/dashboard_dist
          pnpm test:e2e
