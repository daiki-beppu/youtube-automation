name: Code review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

# contents: read のままにする(レビューは提案のみで、PR ブランチへの push を機構的に禁止する)
permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auth-check:
    if: ${{ !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'skip-review') && !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.auth.outputs.available }}
    steps:
      - name: Check Claude authentication
        id: auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" || -n "$ANTHROPIC_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Code review skipped: neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is configured."
          {
            echo "## Code review"
            echo
            echo "⏭️ Skipped: neither \`CLAUDE_CODE_OAUTH_TOKEN\` nor \`ANTHROPIC_API_KEY\` is configured."
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    needs: auth-check
    if: needs.auth-check.outputs.available == 'true'
    runs-on: ubuntu-latest
    # 集約コメントの marker は ci-autofix.yml の gate が startswith で探す契約。
    # 検索側(Look up previous review)と書き込み側(Post review comment)で必ず同一にする
    env:
      REVIEW_MARKER: "<!-- code-review-workflow -->"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute diff fingerprint
        id: fingerprint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          patch_id=$(git diff "${BASE_SHA}...${HEAD_SHA}" | git patch-id --stable | cut -d' ' -f1)
          echo "patch_id=${patch_id}" >> "$GITHUB_OUTPUT"
      - name: Look up previous review
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PATCH_ID: ${{ steps.fingerprint.outputs.patch_id }}
        run: |
          set -eu -o pipefail
          # コメント一覧の取得はこの 1 回だけ。id も同時に拾って Post review comment へ渡す。
          # --slurp は全 page を 1 つの配列へ畳むので page 境界を跨いで先頭 1 件を選べる
          # （--slurp は --jq と併用できないため jq へパイプする）。jq -c で 1 行に固定し、
          # 入力を読み切る jq を終端に置くことで --paginate 中の SIGPIPE も起こさない。
          comment="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --slurp \
            | jq -c "[.[][] | select(.body | startswith(\"${REVIEW_MARKER}\"))][0] // empty")"
          comment_id="$(jq -r '.id // empty' <<<"$comment")"
          body="$(jq -r '.body // empty' <<<"$comment")"
          echo "comment_id=${comment_id}" >> "$GITHUB_OUTPUT"
          meta="$(grep -m1 -oE '<!-- code-review-meta patch=[0-9a-f]+ crit=[0-9]+ -->' <<<"$body" || true)"
          prev_patch="$(grep -oE 'patch=[0-9a-f]+' <<<"$meta" | cut -d= -f2 || true)"
          prev_crit="$(grep -oE 'crit=[0-9]+' <<<"$meta" | cut -d= -f2 || true)"
          if [ -n "$PATCH_ID" ] && [ -n "$prev_patch" ] && [ "$PATCH_ID" = "$prev_patch" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "prev_crit=${prev_crit:-0}" >> "$GITHUB_OUTPUT"
            echo "::notice::diff unchanged since last review (patch-id ${PATCH_ID}); skipping paid review"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "prev_crit=" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Claude code review
        id: review
        if: steps.previous.outputs.skip != 'true'
        uses: anthropics/claude-code-action@4a3947e8ca609a286ab07d4d048d9ec4016798c1 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 既定の OIDC → Claude App トークン交換(id-token: write が必要で、App トークンは
          # push 権限を持ちうる)を使わず、この workflow の read 権限に閉じたトークンで動かす
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Claude Code セッション由来の push は actor が bot "claude" になり、action が
          # 既定で起動を拒否する。レビューは提案のみ（push 権限なし）なので許可してよい
          allowed_bots: claude
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: mattpocock-skills@claude-plugins-official
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            あなたはこの PR のマージ前レビューゲートです。コードの修正・コメント投稿は一切行わず、
            レビュー結果を structured output で報告することだけがあなたの仕事です。
            (PR へのコメント投稿は後続の workflow step が structured output から行います)

            ## 手順
            1. `gh pr view` / `gh pr diff` で PR の内容と base branch との差分を取得する
               `gh pr checks` を Checks API の正本として使い、参照時点の状態だけを取得する。
               pending check の完了は待たず、CI の最終 green 判定は既存 GitHub checks に任せる
            2. PR タイトルまたは commit subject 末尾の `(#N)` から起点 issue 番号を特定し、
               `gh issue view N` で要件を読む。特定できなければ Spec 軸は「起点 issue 不明」と
               レポートに明記して省略する
            3. /mattpocock-skills:code-review スキルで差分を 2 軸レビューする:
               Standards(このリポジトリの規約への準拠)/ Spec(起点 issue の要件との整合)
            4. 同じ差分を simplify 観点(reuse / simplification / efficiency)でもレビューする。
               改善提案はレポート内のコード例に留める
            5. 指摘ごとに severity を付ける:
               - critical: Spec 違反(起点 issue の要件を満たさない・壊す)、明白なバグ相当
               - warning: Standards 違反(リポジトリ規約からの逸脱)
               - warning / info: simplify 系の提案(critical にはしない)
            6. structured output で結果を返す:
               - report_markdown: 全指摘を集約した Markdown レポート。冒頭に severity ごとの
                 件数サマリ、続けて severity 順に各指摘(対象ファイル・内容・修正案)を書く
               - critical_count / warning_count / info_count: report_markdown に書いた
                 件数と一致する値

            ## 禁止事項
            - ファイルの編集・commit・push(このワークフローには push 権限が無い)
            - `gh pr comment` 等でのコメント投稿(投稿は workflow step の責務)
            - ツール許可不足やローカルの full suite 未実行を、CI 未検証・サンドボックス制限の
              finding として報告すること
          # PR レビューのコスト対策として sonnet 系を既定にする
          claude_args: |
            --model sonnet
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git merge-base:*)"
            --json-schema '{"type":"object","properties":{"report_markdown":{"type":"string"},"critical_count":{"type":"integer","minimum":0},"warning_count":{"type":"integer","minimum":0},"info_count":{"type":"integer","minimum":0}},"required":["report_markdown","critical_count","warning_count","info_count"]}'
      - name: Post review comment
        if: steps.previous.outputs.skip != 'true' && steps.review.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PATCH_ID: ${{ steps.fingerprint.outputs.patch_id }}
          COMMENT_ID: ${{ steps.previous.outputs.comment_id }}
        run: |
          set -eu
          critical=$(jq -r '.critical_count' <<<"$STRUCTURED_OUTPUT")
          {
            echo "$REVIEW_MARKER"
            echo "<!-- code-review-meta patch=${PATCH_ID} crit=${critical} -->"
            echo
            jq -r '.report_markdown' <<<"$STRUCTURED_OUTPUT"
          } > "$RUNNER_TEMP/review-comment.md"
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              -F "body=@$RUNNER_TEMP/review-comment.md" > /dev/null
            echo "updated comment ${COMMENT_ID}"
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -F "body=@$RUNNER_TEMP/review-comment.md" > /dev/null
            echo "created a new comment"
          fi
      - name: Fail on critical findings
        env:
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          SKIPPED: ${{ steps.previous.outputs.skip }}
          PREV_CRIT: ${{ steps.previous.outputs.prev_crit }}
        run: |
          set -eu
          if [ "$SKIPPED" = "true" ]; then
            critical="${PREV_CRIT:-0}"
            echo "review skipped (unchanged diff); re-applying previous verdict: critical=${critical}"
          else
            critical=$(jq -r '.critical_count' <<<"$STRUCTURED_OUTPUT")
            warning=$(jq -r '.warning_count' <<<"$STRUCTURED_OUTPUT")
            info=$(jq -r '.info_count' <<<"$STRUCTURED_OUTPUT")
            echo "critical=${critical} warning=${warning} info=${info}"
          fi
          if [ "$critical" -gt 0 ]; then
            echo "::error::Code review found ${critical} critical finding(s). See the review comment on the PR."
            exit 1
          fi
