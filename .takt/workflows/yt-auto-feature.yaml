name: yt-auto-feature
description: >
  新機能・機能拡張用。intake、実装前設計ゲート、test-first、6 観点の専門レビュー、
  CI 同等ゲート、fail-closed final gate、spillover を行う。
capabilities: [readonly, enable-skills]
max_steps: 50
initial_step: intake

loop_monitors:
  - cycle: [design_fix, design_review]
    ignore_steps: [design_gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: 指摘が収束しており同じ契約のまま設計を再審査できる
          next: design_review
        - condition: 設計の前提または受入条件を再検討する必要がある
          next: plan
        - condition: 同じ指摘が反復し安全に収束できない
          next: ABORT
  - cycle: [replan, implement]
    ignore_steps: [reviewers, review_gate, ci_verify, final_gate, fix]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: 未試行の実装方針と検証手順を具体化できる
          next: replan
        - condition: 受入条件を満たす実現可能な方針がない
          next: ABORT
  - cycle: [fix, reviewers]
    ignore_steps: [review_gate, ci_verify, final_gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 修正進捗があり次の修正が実行可能である
          next: fix
        - condition: 実装方針の再定義が必要である
          next: replan
        - condition: 修正が停滞し収束見込みがない
          next: ABORT

steps:
  - name: intake
    uses: intake
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.intake.verdict == "ready")
        next: plan
      - condition: when(structured.intake.verdict == "blocked" || structured.intake.verdict == "abort")
        next: ABORT
      - condition: when(true)
        next: ABORT

  - name: plan
    uses: implementation-high-plan-to-write-tests
    instruction: yt-auto-feature-plan
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.plan.verdict == "planned")
        next: test_design
      - condition: when(true)
        next: ABORT

  - name: test_design
    tags: [plan, test-planning]
    edit: false
    persona: test-planner
    instruction: yt-auto-test-design
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.test_design.verdict == "designed")
        next: design_review
      - condition: when(structured.test_design.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: design_review
    uses: design-review
    rules:
      self:
        - condition: all("review_complete")
          next: design_gate
      parallel:
        requirements_review:
          - condition: review_complete
        architecture_review:
          - condition: review_complete
        test_design_review:
          - condition: review_complete

  - name: design_gate
    tags: [review, design-gate]
    edit: false
    persona: review-adjudicator
    instruction: yt-auto-review-design-gate
    structured_output:
      schema_ref: yt-auto-decision
    pass_previous_response: false
    rules:
      - condition: when(structured.design_gate.verdict == "approve")
        next: write_tests
      - condition: when(structured.design_gate.verdict == "reject")
        next: design_fix
      - condition: when(structured.design_gate.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: design_fix
    tags: [plan, design-gate]
    edit: false
    session: compact
    persona: planner
    instruction: yt-auto-design-fix
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.design_fix.verdict == "fixed")
        next: design_review
      - condition: when(structured.design_fix.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: write_tests
    uses: implementation-high-write-tests-to-implement
    instruction: yt-auto-write-tests
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.write_tests.verdict == "red_confirmed")
        next: implement
      - condition: when(structured.write_tests.verdict == "replan")
        next: design_fix
      - condition: when(structured.write_tests.verdict == "blocked")
        next: write_tests
        requires_user_input: true
        interactive_only: true
      - condition: when(true)
        next: ABORT

  - name: implement
    tags: [coding]
    capabilities: [edit, enable-skills]
    edit: true
    session: compact
    persona: coder
    policy: [coding, testing]
    knowledge: [takt, architecture, implementation-semantics]
    required_permission_mode: edit
    instruction: yt-auto-implement
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.implement.verdict == "implemented")
        next: reviewers
      - condition: when(structured.implement.verdict == "replan")
        next: replan
      - condition: when(true)
        next: ABORT

  - name: replan
    uses: implementation-high-replan-to-implement
    instruction: yt-auto-replan
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.replan.verdict == "planned")
        next: implement
      - condition: when(true)
        next: ABORT

  - name: reviewers
    uses: reviewers
    rules:
      self:
        - condition: all("review_complete")
          next: review_gate
      parallel:
        arch_review:
          - condition: review_complete
        ai_antipattern_review:
          - condition: review_complete
        coding_review:
          - condition: review_complete
        implementation_semantics_review:
          - condition: review_complete
        contract_lifecycle_review:
          - condition: review_complete
        robustness_review:
          - condition: review_complete

  - name: review_gate
    tags: [review]
    edit: false
    persona: review-adjudicator
    instruction: yt-auto-review-gate
    structured_output:
      schema_ref: yt-auto-decision
    pass_previous_response: false
    rules:
      - condition: when(structured.review_gate.verdict == "approve")
        next: ci_verify
      - condition: when(structured.review_gate.verdict == "reject")
        next: fix
      - condition: when(structured.review_gate.verdict == "replan")
        next: replan
      - condition: when(true)
        next: ABORT

  - name: ci_verify
    uses: ci-verify
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.ci_verify.verdict == "pass")
        next: final_gate
      - condition: when(structured.ci_verify.verdict == "fail")
        next: fix
      - condition: when(true)
        next: ABORT

  - name: final_gate
    kind: workflow_call
    call: final-gate
    args:
      supervise_knowledge: [architecture, takt]
    rules:
      - condition: COMPLETE
        next: spillover
      - condition: needs_fix
        next: fix
      - condition: need_replan
        next: replan
      - condition: ABORT
        next: ABORT

  - name: fix
    uses: fix
    instruction: yt-auto-fix-findings
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.fix.verdict == "fixed")
        next: reviewers
      - condition: when(structured.fix.verdict == "replan")
        next: replan
      - condition: when(true)
        next: ABORT

  - name: spillover
    uses: spillover
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.spillover.verdict == "return")
        next: plan
      - condition: when(structured.spillover.verdict == "complete")
        next: COMPLETE
      - condition: when(true)
        next: ABORT
