name: yt-auto-fix
description: >
  バグ・回帰修正用。intake、原因診断と対立仮説、診断レビュー、修正前 red、
  root-cause repair、6 観点の専門レビュー、CI 同等ゲート、fail-closed final gate、
  spillover を行う。
capabilities: [readonly, enable-skills]
max_steps: 50
initial_step: intake

loop_monitors:
  - cycle: [diagnosis_fix, diagnosis_review]
    ignore_steps: [diagnosis_gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: 診断の証拠が収束しており再審査できる
          next: diagnosis_review
        - condition: 原因仮説を作り直す必要がある
          next: diagnose
        - condition: 同じ指摘が反復し収束見込みがない
          next: ABORT
  - cycle: [diagnose, diagnosis_review]
    ignore_steps: [diagnosis_gate, diagnosis_fix, reproduce]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: 新しい反証または観測で仮説が収束している
          next: diagnose
        - condition: 同じ仮説と失敗が反復している
          next: ABORT
  - cycle: [fix, reviewers]
    ignore_steps: [review_gate, ci_verify, final_gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 修正進捗があり次の修正が実行可能である
          next: fix
        - condition: 原因仮説を再検証する必要がある
          next: diagnose
        - condition: 修正が停滞し収束見込みがない
          next: ABORT

steps:
  - name: intake
    uses: intake
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.intake.verdict == "ready")
        next: diagnose
      - condition: when(structured.intake.verdict == "blocked" || structured.intake.verdict == "abort")
        next: ABORT
      - condition: when(true)
        next: ABORT

  - name: diagnose
    tags: [plan, diagnosis]
    edit: false
    session: compact
    persona: planner
    instruction: yt-auto-diagnose
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.diagnose.verdict == "planned")
        next: diagnosis_review
      - condition: when(true)
        next: ABORT

  - name: diagnosis_review
    uses: diagnosis-review
    rules:
      self:
        - condition: all("review_complete")
          next: diagnosis_gate
      parallel:
        causal_review:
          - condition: review_complete
        competing_hypothesis_review:
          - condition: review_complete
        regression_review:
          - condition: review_complete

  - name: diagnosis_gate
    tags: [review, diagnosis-gate]
    edit: false
    persona: review-adjudicator
    instruction: yt-auto-review-diagnosis-gate
    structured_output:
      schema_ref: yt-auto-decision
    pass_previous_response: false
    rules:
      - condition: when(structured.diagnosis_gate.verdict == "approve")
        next: reproduce
      - condition: when(structured.diagnosis_gate.verdict == "reject")
        next: diagnosis_fix
      - condition: when(structured.diagnosis_gate.verdict == "rediagnose")
        next: diagnose
      - condition: when(true)
        next: ABORT

  - name: diagnosis_fix
    tags: [plan, diagnosis-gate]
    edit: false
    session: compact
    persona: planner
    instruction: yt-auto-diagnosis-fix
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.diagnosis_fix.verdict == "fixed")
        next: diagnosis_review
      - condition: when(structured.diagnosis_fix.verdict == "rediagnose")
        next: diagnose
      - condition: when(true)
        next: ABORT

  - name: reproduce
    tags: [coding, test-planning]
    capabilities: [edit, enable-skills]
    edit: true
    session: compact
    persona: coder
    policy: [coding, testing]
    knowledge: [takt, architecture, unit-testing, implementation-semantics]
    required_permission_mode: edit
    instruction: yt-auto-reproduce
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.reproduce.verdict == "red_confirmed")
        next: repair
      - condition: when(structured.reproduce.verdict == "red_mismatch")
        next: diagnose
      - condition: when(true)
        next: ABORT

  - name: repair
    tags: [coding]
    capabilities: [edit, enable-skills]
    edit: true
    session: compact
    persona: coder
    policy: [coding, testing]
    knowledge: [takt, architecture, implementation-semantics]
    required_permission_mode: edit
    instruction: yt-auto-repair
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.repair.verdict == "repaired")
        next: reviewers
      - condition: when(structured.repair.verdict == "rediagnose")
        next: diagnose
      - condition: when(true)
        next: ABORT

  - name: reviewers
    uses: reviewers
    rules:
      self:
        - condition: all("review_complete")
          next: review_gate
      parallel:
        arch_review:
          - condition: review_complete
        ai_antipattern_review:
          - condition: review_complete
        coding_review:
          - condition: review_complete
        implementation_semantics_review:
          - condition: review_complete
        contract_lifecycle_review:
          - condition: review_complete
        robustness_review:
          - condition: review_complete

  - name: review_gate
    tags: [review]
    edit: false
    persona: review-adjudicator
    instruction: yt-auto-review-gate
    structured_output:
      schema_ref: yt-auto-decision
    pass_previous_response: false
    rules:
      - condition: when(structured.review_gate.verdict == "approve")
        next: ci_verify
      - condition: when(structured.review_gate.verdict == "reject")
        next: fix
      - condition: when(structured.review_gate.verdict == "replan")
        next: diagnose
      - condition: when(true)
        next: ABORT

  - name: ci_verify
    uses: ci-verify
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.ci_verify.verdict == "pass")
        next: final_gate
      - condition: when(structured.ci_verify.verdict == "fail")
        next: fix
      - condition: when(true)
        next: ABORT

  - name: final_gate
    kind: workflow_call
    call: final-gate
    args:
      supervise_knowledge: [architecture, takt]
    rules:
      - condition: COMPLETE
        next: spillover
      - condition: needs_fix
        next: fix
      - condition: need_replan
        next: diagnose
      - condition: ABORT
        next: ABORT

  - name: fix
    uses: fix
    instruction: yt-auto-fix-findings
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.fix.verdict == "fixed")
        next: reviewers
      - condition: when(structured.fix.verdict == "rediagnose")
        next: diagnose
      - condition: when(true)
        next: ABORT

  - name: spillover
    uses: spillover
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.spillover.verdict == "return")
        next: diagnose
      - condition: when(structured.spillover.verdict == "complete")
        next: COMPLETE
      - condition: when(true)
        next: ABORT
