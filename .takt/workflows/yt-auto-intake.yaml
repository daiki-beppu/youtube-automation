name: yt-auto-intake
description: >
  共通の intake フェーズ。issue を読み、着手可能性を判定して実装ブリーフを作る。
  yt-auto-feature / yt-auto-fix / yt-auto-docs / yt-auto-maintenance の各 workflow から呼ばれる。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - blocked
  # instruction を param で差し替えない。レーンごとに差し替えると着手可能性の判定手順が
  # 丸ごと複製され、「複製された定義は必ず片方だけ更新される」に自分でぶつかる。
  # 着手可能性の判定(未決事項・矛盾・依存・情報不足)はレーンによらず変わらない。
  # fix 固有の入口検査(再現条件を確定できるか)は diagnose が持つ
workflow_config:
  provider_options:
    codex:
      network_access: true
      # takt 0.53 で workflow の Codex Skill 継承が既定 off になった(#1081)。本リポジトリは
      # .agents/skills(→ .claude/skills)を Codex 向けに維持しているため repo スコープのみ
      # 復元する(0.54 simple family と同じ設計。user スコープは個人環境由来のため継承しない)
      skills:
        repo: true
    opencode:
      network_access: true
max_steps: 5
initial_step: read_issue
steps:
  # system step。issue / task / branch のコンテキストを TAKT 側から受け取り、
  # 次の agent step が {context:read_issue.*} で参照できるようにする。
  - name: read_issue
    mode: system
    system_inputs:
      - type: task_context
        source: current_task
        as: task
      - type: issue_context
        source: current_task
        as: issue
      - type: branch_context
        source: current_task
        as: branch
    rules:
      - condition: when(true)
        next: assess

  - name: assess
    description: 着手可能性の判定と実装ブリーフの作成
    tags:
      - plan
      - intake
    edit: false
    persona: yt-auto-intake-analyst
    knowledge:
      - yt-auto-domain
    # review-readonly = Read / Glob / Grep / Bash / WebSearch / WebFetch。
    # gh CLI を使うため Bash が要る。編集は edit: false で禁じる。
    provider_options:
      extends: review-readonly
    instruction: yt-auto-intake
    quality_gates:
      - 判定の根拠として issue の該当箇所を引用していること
      - 依存する issue / PR があるとき、その状態(open / merged)を実際に照会していること
      - BLOCKED のとき、人間が次に取るべきアクションを具体のコマンドまで書いていること
    rules:
      - condition: 着手可能(READY)
        next: COMPLETE
      - condition: 着手できない(BLOCKED)
        return: blocked
    output_contracts:
      report:
        - name: intake-brief.md
          format: yt-auto-intake-brief
