name: yt-auto-docs
description: >
  文書・skill・instruction とその repository-contract test だけを変更する lane。
  intake、文書限定計画、実装、2 観点の文書レビュー、CI 同等ゲート、
  fail-closed final gate、spillover を行い production/runtime 変更は拒否する。
capabilities: [readonly, enable-skills]
max_steps: 32
initial_step: intake

loop_monitors:
  - cycle: [docs_fix, docs_review]
    ignore_steps: [docs_gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: 文書指摘が収束しており再審査できる
          next: docs_review
        - condition: 文書の前提または出典を再計画する必要がある
          next: plan
        - condition: 同じ指摘が反復し収束見込みがない
          next: ABORT
  - cycle: [plan, implement]
    ignore_steps: [docs_review, docs_gate, docs_fix, ci_verify, final_gate]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: 文書限定の未試行方針を具体化できる
          next: plan
        - condition: 文書限定では受入条件を満たせない
          next: ABORT

steps:
  - name: intake
    uses: intake
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.intake.verdict == "ready")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: plan
    uses: implementation-high-plan-to-write-tests
    instruction: yt-auto-docs-plan
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.plan.verdict == "planned")
        next: implement
      - condition: when(true)
        next: ABORT

  - name: implement
    tags: [coding, docs]
    capabilities: [edit, enable-skills]
    edit: true
    session: compact
    persona: coder
    required_permission_mode: edit
    instruction: yt-auto-docs-implement
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.implement.verdict == "implemented")
        next: docs_review
      - condition: when(structured.implement.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: docs_review
    uses: docs-reviewers
    rules:
      self:
        - condition: all("review_complete")
          next: docs_gate
      parallel:
        correctness_review:
          - condition: review_complete
        consistency_review:
          - condition: review_complete

  - name: docs_gate
    tags: [review, docs-gate]
    edit: false
    persona: review-adjudicator
    instruction: yt-auto-review-docs-gate
    structured_output:
      schema_ref: yt-auto-decision
    pass_previous_response: false
    rules:
      - condition: when(structured.docs_gate.verdict == "approve")
        next: ci_verify
      - condition: when(structured.docs_gate.verdict == "reject")
        next: docs_fix
      - condition: when(structured.docs_gate.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: docs_fix
    tags: [coding, docs]
    capabilities: [edit, enable-skills]
    edit: true
    session: compact
    persona: coder
    required_permission_mode: edit
    instruction: yt-auto-docs-implement
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.docs_fix.verdict == "implemented")
        next: docs_review
      - condition: when(structured.docs_fix.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: ci_verify
    uses: ci-verify
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.ci_verify.verdict == "pass")
        next: final_gate
      - condition: when(structured.ci_verify.verdict == "fail")
        next: docs_fix
      - condition: when(true)
        next: ABORT

  - name: final_gate
    kind: workflow_call
    call: final-gate
    args:
      supervise_knowledge: [architecture]
    rules:
      - condition: COMPLETE
        next: spillover
      - condition: needs_fix
        next: docs_fix
      - condition: need_replan
        next: plan
      - condition: ABORT
        next: ABORT

  - name: spillover
    uses: spillover
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.spillover.verdict == "return")
        next: plan
      - condition: when(structured.spillover.verdict == "complete")
        next: COMPLETE
      - condition: when(true)
        next: ABORT
