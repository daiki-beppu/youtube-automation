name: audit-unit-split
description: スコープ分割版ユニットテスト監査。plan が台帳スケルトンを作り、audit が {report} 注入された既存台帳をインクリメンタルに拡張する。コード修正なしで Issue 直貼り可能なレポートを作成する
capabilities: readonly
# 汎用 audit lane と違い、production/test file を個別行へ分割する台帳形式を維持する。
# plan が全対象を列挙し、audit は既存行を消さず一定量ずつ判定し、supervise と review が
# 物理行数・進捗・根拠を独立検収する。
max_steps: 32
initial_step: plan

loop_monitors:
  - cycle: [audit, supervise]
    ignore_steps: [review]
    threshold: 3
    judge:
      persona: supervisor
      instruction: |
        unit audit の audit → supervise サイクルが {cycle_count} 回繰り返されました。
        監査台帳（02-unit-audit.md）の進捗行と表の行数を履歴と比較し、以下を判断してください:
        - 進捗行「台帳済み: 本番 n/N、テスト判定済み m/M」の n・m が前回サイクルから実際に増えているか
        - 残りの未台帳・未判定件数は合理的なサイクル数で完了可能か
      rules:
        - condition: 監査品質・スコープが十分
          next: review
        - condition: 台帳が拡大しており改善が続いている
          next: audit
        - condition: 台帳が停滞し改善の見込みがない
          next: ABORT

steps:
  - name: plan
    tags:
      - plan
    edit: false
    persona: test-planner
    policy: testing
    knowledge:
      - architecture
      - unit-testing
    instruction: unit-audit-split-plan
    output_contracts:
      report:
        - name: 01-unit-audit-plan.md
          format: unit-audit-plan
        - name: 02-unit-audit.md
          format: unit-audit-ledger
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.plan.verdict == "planned")
        next: audit
      - condition: when(true)
        next: ABORT

  - name: audit
    tags:
      - review
    edit: false
    persona: testing-reviewer
    policy:
      - review
      - testing
    knowledge:
      - architecture
      - unit-testing
    instruction: unit-audit-split-audit
    output_contracts:
      report:
        - name: 02-unit-audit.md
          format: unit-audit-ledger
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.audit.verdict == "scope_complete")
        next: supervise
      - condition: when(structured.audit.verdict == "progressed")
        next: supervise
      - condition: when(true)
        next: ABORT

  - name: supervise
    tags:
      - review
      - supervise
    edit: false
    persona: supervisor
    knowledge:
      - unit-testing
    instruction: unit-audit-supervise
    pass_previous_response: false
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.supervise.verdict == "approve")
        next: review
      - condition: when(structured.supervise.verdict == "rework")
        next: audit
      - condition: when(true)
        next: ABORT

  - name: review
    tags:
      - review
    edit: false
    persona: testing-reviewer
    policy:
      - testing
    knowledge:
      - unit-testing
    instruction: unit-audit-split-review
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.review.verdict == "approve")
        next: COMPLETE
      - condition: when(structured.review.verdict == "rework")
        next: audit
      - condition: when(true)
        next: ABORT
