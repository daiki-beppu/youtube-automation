name: yt-auto-audit-runs
description: >
  takt 資産と読み取り可能な run trace の read-only 監査 lane。定義・参照・有限停止・
  composition・反復失敗を追記型台帳で監査し、独立検収後だけ docs/audits/ へ配置する。
capabilities: [readonly, enable-skills]
max_steps: 24
initial_step: plan

loop_monitors:
  - cycle: [audit, supervise]
    ignore_steps: [review]
    threshold: 3
    judge:
      persona: supervisor
      instruction: yt-auto-audit-supervise
      rules:
        - condition: APPROVE
          next: review
        - condition: REWORK
          next: audit
        - condition: ABORT
          next: ABORT

steps:
  - name: plan
    tags: [plan, audit]
    edit: false
    persona: planner
    instruction: yt-auto-audit-runs-plan
    output_contracts:
      report:
        - name: audit-plan.md
          format: yt-auto-audit-plan
        - name: audit-ledger.md
          format: yt-auto-audit-ledger
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.plan.verdict == "planned")
        next: audit
      - condition: when(true)
        next: ABORT

  - name: audit
    tags: [review, audit]
    edit: false
    session: refresh
    persona: testing-reviewer
    instruction: yt-auto-audit-runs-run
    output_contracts:
      report:
        - name: audit-ledger.md
          format: yt-auto-audit-ledger
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.audit.verdict == "scope_complete")
        next: supervise
      - condition: when(structured.audit.verdict == "progressed")
        next: supervise
      - condition: when(true)
        next: ABORT

  - name: supervise
    tags: [review, supervise]
    edit: false
    persona: supervisor
    instruction: yt-auto-audit-supervise
    pass_previous_response: false
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.supervise.verdict == "approve")
        next: review
      - condition: when(structured.supervise.verdict == "rework")
        next: audit
      - condition: when(true)
        next: ABORT

  - name: review
    tags: [review, final-gate]
    edit: false
    persona: review-adjudicator
    instruction: yt-auto-audit-review
    pass_previous_response: false
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.review.verdict == "approve")
        next: publish
      - condition: when(structured.review.verdict == "rework")
        next: audit
      - condition: when(true)
        next: ABORT

  - name: publish
    tags: [delivery, docs]
    capabilities: [edit, enable-skills]
    edit: true
    persona: coder
    required_permission_mode: edit
    instruction: yt-auto-audit-publish
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.publish.verdict == "published")
        next: COMPLETE
      - condition: when(true)
        next: ABORT
