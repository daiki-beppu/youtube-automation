name: yt-auto-maintenance
description: >
  挙動維持の保守・リファクタ用。intake、維持契約の計画と設計ゲート、変更前
  safety net、リファクタ、6 観点の専門レビュー、CI 同等ゲート、
  fail-closed final gate、spillover を行う。
capabilities: [readonly, enable-skills]
max_steps: 44
initial_step: intake

loop_monitors:
  - cycle: [plan_fix, plan_review]
    ignore_steps: [plan_gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: 維持契約の指摘が収束しており再審査できる
          next: plan_review
        - condition: 挙動維持の前提を再計画する必要がある
          next: plan
        - condition: 同じ指摘が反復し収束見込みがない
          next: ABORT
  - cycle: [plan, refactor]
    ignore_steps: [plan_review, plan_gate, plan_fix, safety_net, reviewers, review_gate, ci_verify, final_gate, fix]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: 挙動を変えない未試行方針を具体化できる
          next: plan
        - condition: 挙動変更なしでは目的を達成できない
          next: ABORT
  - cycle: [fix, reviewers]
    ignore_steps: [review_gate, ci_verify, final_gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 修正進捗があり次の修正が実行可能である
          next: fix
        - condition: 維持契約または方針の再計画が必要である
          next: plan
        - condition: 修正が停滞し収束見込みがない
          next: ABORT

steps:
  - name: intake
    uses: intake
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.intake.verdict == "ready")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: plan
    uses: implementation-high-plan-to-write-tests
    instruction: yt-auto-maintenance-plan
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.plan.verdict == "planned")
        next: plan_review
      - condition: when(true)
        next: ABORT

  - name: plan_review
    uses: design-review
    rules:
      self:
        - condition: all("review_complete")
          next: plan_gate
      parallel:
        requirements_review:
          - condition: review_complete
        architecture_review:
          - condition: review_complete
        test_design_review:
          - condition: review_complete

  - name: plan_gate
    tags: [review, design-gate]
    edit: false
    persona: review-adjudicator
    instruction: yt-auto-review-design-gate
    structured_output:
      schema_ref: yt-auto-decision
    pass_previous_response: false
    rules:
      - condition: when(structured.plan_gate.verdict == "approve")
        next: safety_net
      - condition: when(structured.plan_gate.verdict == "reject")
        next: plan_fix
      - condition: when(structured.plan_gate.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: plan_fix
    tags: [plan]
    edit: false
    session: compact
    persona: planner
    instruction: yt-auto-design-fix
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.plan_fix.verdict == "fixed")
        next: plan_review
      - condition: when(structured.plan_fix.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: safety_net
    tags: [coding, test-planning]
    capabilities: [edit, enable-skills]
    edit: true
    session: compact
    persona: coder
    policy: testing
    required_permission_mode: edit
    instruction: yt-auto-safety-net
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.safety_net.verdict == "baseline_ready")
        next: refactor
      - condition: when(structured.safety_net.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: refactor
    tags: [coding]
    capabilities: [edit, enable-skills]
    edit: true
    session: compact
    persona: coder
    policy: [coding, testing]
    knowledge: [architecture, implementation-semantics]
    required_permission_mode: edit
    instruction: yt-auto-refactor
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.refactor.verdict == "refactored")
        next: reviewers
      - condition: when(structured.refactor.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: reviewers
    uses: reviewers
    rules:
      self:
        - condition: all("review_complete")
          next: review_gate
      parallel:
        arch_review:
          - condition: review_complete
        ai_antipattern_review:
          - condition: review_complete
        coding_review:
          - condition: review_complete
        implementation_semantics_review:
          - condition: review_complete
        contract_lifecycle_review:
          - condition: review_complete
        robustness_review:
          - condition: review_complete

  - name: review_gate
    tags: [review]
    edit: false
    persona: review-adjudicator
    instruction: yt-auto-review-gate
    structured_output:
      schema_ref: yt-auto-decision
    pass_previous_response: false
    rules:
      - condition: when(structured.review_gate.verdict == "approve")
        next: ci_verify
      - condition: when(structured.review_gate.verdict == "reject")
        next: fix
      - condition: when(structured.review_gate.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: ci_verify
    uses: ci-verify
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.ci_verify.verdict == "pass")
        next: final_gate
      - condition: when(structured.ci_verify.verdict == "fail")
        next: fix
      - condition: when(true)
        next: ABORT

  - name: final_gate
    kind: workflow_call
    call: final-gate
    args:
      supervise_knowledge: [architecture, takt]
    rules:
      - condition: COMPLETE
        next: spillover
      - condition: needs_fix
        next: fix
      - condition: need_replan
        next: plan
      - condition: ABORT
        next: ABORT

  - name: fix
    uses: fix
    instruction: yt-auto-fix-findings
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.fix.verdict == "fixed")
        next: reviewers
      - condition: when(structured.fix.verdict == "replan")
        next: plan
      - condition: when(true)
        next: ABORT

  - name: spillover
    uses: spillover
    structured_output:
      schema_ref: yt-auto-decision
    rules:
      - condition: when(structured.spillover.verdict == "return")
        next: plan
      - condition: when(structured.spillover.verdict == "complete")
        next: COMPLETE
      - condition: when(true)
        next: ABORT
