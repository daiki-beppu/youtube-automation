# automation リポジトリの takt 設定
# provider は Codex に固定し、model / language / concurrency はグローバル設定
# (~/.takt/config.yaml) を継承する。
#
# workflow はリポジトリ専用の .takt/workflows/ を使う (issue #2686。運用は docs/takt-operations.md):
#   yt-auto-feature     — 新機能・機能拡張(intake → 計画 → テスト設計 → 設計レビュー →
#                      テスト先行実装 → 実装 → 実装レビュー → CI 同等ゲート → 最終ゲート → spillover)
#   yt-auto-fix         — バグ修正・回帰修正(intake → 診断 → 診断レビュー → 再現テスト →
#                      修正 → 実装レビュー → CI 同等ゲート → 最終ゲート → spillover)
#   yt-auto-docs        — docs / skill 限定変更の軽量レーン(プロダクションコード変更は不可)
#   yt-auto-maintenance — 定期リファクタリング(維持契約の列挙 → safety net → リファクタ)
#   yt-auto-audit       — 汎用監査(台帳ベース。テスト監査・タスク完了検収など)
#   yt-auto-audit-runs  — takt 資産の監査(workflow 定義の整合 + .takt/runs の実行トレース)
#   yt-auto-intake / yt-auto-impl-review — 共通 callable sub-workflow
#   audit-unit-split — ユニットテスト監査 16 分割の特化 workflow(稼働中・現状維持)
# commit / push / PR 作成は workflow 完了後に takt の auto_pr が行う。
# タスク投入時は auto_pr: true を設定すること。
# facets は .takt/facets/、structured output schema は .takt/schemas/。
# 定義を変えたら `takt workflow doctor <name>` で検証する。
draft_pr: false
base_branch: main

# 失敗タスクの自動再実行を無効化する（グローバルの auto_requeue_max_attempts: 2 を上書き）。
# yt-auto-* の workflow は intake / plan で「着手すべきでない」と判断したとき設計どおり ABORT
# する。auto_requeue はこれを失敗として同じ入力のまま回し直すため、判断が覆ることはなく
# 試行回数とトークンだけを消費する（#3043 で plan の ABORT に対し 2 回消費し、requeue された
# run はいずれも "Task was interrupted" で終わった）。
# 0 にすると runAllTasks 起動時の requeueExistingFailedTasks も止まり、過去の failed タスクが
# takt run のたびに掘り起こされることもなくなる。再実行は失敗原因を解消してから明示的に積む。
auto_requeue_max_attempts: 0

provider: codex

# sandbox 化された worker の direnv / lefthook セットアップ停滞対策（issue #1999）と、
# sibling worktree 由来 path の持ち込み遮断（issue #2163）。
# bb9d9dd9 での config 削除時に消失し、~/.cache/uv・.git/hooks への sandbox
# 権限エラーが再発したため復旧する（issue #2532）。
# runtime-prepare.sh の stdout（KEY=VALUE）が全 worker の環境へ注入され、
# TMPDIR / XDG_CACHE_HOME / XDG_CONFIG_HOME / XDG_DATA_HOME / XDG_STATE_HOME /
# UV_CACHE_DIR を current TAKT_RUNTIME_ROOT 配下へ再構成して direnv allow を通し、
# lefthook install はスキップさせる（ゲートは CI 側で担保）。
runtime:
  prepare:
    - .takt/runtime-prepare.sh

# トークン消費の計測。記録先: .takt/runs/<run>/logs/<session>-usage-events.phase.jsonl
observability:
  enabled: true
  usage_events_phase: true

# 全ペルソナを Codex provider で実行する。
# reviewer と、review step から provider / model を継承する loop monitor judge は Terra を使う。
#
# 注意: takt v0.52 の config 解決では、project が provider_routing を定義すると
# global (~/.takt/config.yaml) の provider_routing は deep merge されず丸ごと無視される。
# また deprecated な persona_providers はソース種別として provider_routing.personas より
# 優先度が低く、global 側の provider_routing.personas に負ける（#2535 で実測）。
# そのため全ペルソナを global と同値でここに複製する。
# global 側のルーティングを変更した場合は、このファイルへの反映も必要。
provider_routing:
  # takt 0.50 の final-gate タグルーティング(#954)。builtin の merge-readiness-final-gate
  # (yt-auto-feature / fix / maintenance の final_gate)と yt-auto-audit の review step が
  # このタグを持つ。tags は personas より優先されるため(provider-resolution の
  # PROVIDER_MODEL_SOURCE_PRIORITY: tags=5 < personas=6)、auto_pr 前の最終関門だけ
  # レビュー既定の Terra より強い Sol へ振る。最終ゲートは 1 run に 1〜2 回しか走らない
  tags:
    final-gate:
      provider: codex
      model: gpt-5.6-sol
  personas:
    coder:
      provider: codex
      model: gpt-5.6-luna
    planner:
      provider: codex
      model: gpt-5.6-sol
    diagnoser:
      provider: codex
      model: gpt-5.6-sol
    ai-antipattern-reviewer:
      provider: codex
      model: gpt-5.6-terra
    architecture-reviewer:
      provider: codex
      model: gpt-5.6-terra
    coding-reviewer:
      provider: codex
      model: gpt-5.6-terra
    cqrs-es-reviewer:
      provider: codex
      model: gpt-5.6-terra
    frontend-reviewer:
      provider: codex
      model: gpt-5.6-terra
    implementation-semantics-reviewer:
      provider: codex
      model: gpt-5.6-terra
    merge-readiness-reviewer:
      provider: codex
      model: gpt-5.6-terra
    qa-reviewer:
      provider: codex
      model: gpt-5.6-terra
    requirements-reviewer:
      provider: codex
      model: gpt-5.6-terra
    security-reviewer:
      provider: codex
      model: gpt-5.6-terra
    terraform-reviewer:
      provider: codex
      model: gpt-5.6-terra
    testing-reviewer:
      provider: codex
      model: gpt-5.6-terra
    # ── 以下は yt-auto-* workflow 専用の persona(issue #2686)。グローバルに登録がなく、
    #    既定モデルへフォールバックしてしまうものをここで固定する ──
    # intake の判定が全工程の入口。誤って着手を通すと後段すべてが無駄になるため最上位モデル
    yt-auto-intake-analyst:
      provider: codex
      model: gpt-5.6-sol
    # 設計ゲートの一角。テスト設計の誤りは write_tests で red を確認しても表面化せず、
    # 「通るだけで要件を検証しないテスト」として実装後まで残る。planner と同格に置く
    test-planner:
      provider: codex
      model: gpt-5.6-sol
    # 診断ゲートの一角。誤った原因のまま進むと、テストも修正もすべて無駄になる。
    # 再現テストの red は「症状を再現できたか」しか見ないため、「症状は再現するが
    # 因果の理解が違う」誤診はここでしか捕まらない。intake と同格に置く
    yt-auto-diagnosis-reviewer:
      provider: codex
      model: gpt-5.6-sol
    # 規約文書(CLAUDE.md / docs/development.md / ADR)と差分の照合。他 reviewer と同格
    yt-auto-conventions-reviewer:
      provider: codex
      model: gpt-5.6-terra
    # spillover / audit publish の gh 操作(起票・重複照合・レポート配置)が主。
    # 手続き的な作業なので軽量モデル
    yt-auto-delivery-operator:
      provider: codex
      model: gpt-5.6-luna
