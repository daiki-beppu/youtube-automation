# Legacy configuration retained for historical reference.
# Development runs directly in worktrees; do not use takt in this repository.
draft_pr: false
base_branch: main
auto_requeue_max_attempts: 0
# provider はグローバルの ~/.takt/runtime.yaml が持つ。ここに書くと runtime.yaml と混在して
# "Mixed provider configuration" で takt が止まる

runtime:
  prepare:
    - .takt/runtime-prepare.sh

observability:
  enabled: true
  usage_events_phase: true
