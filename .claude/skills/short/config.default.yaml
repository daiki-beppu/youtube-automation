# /short skill 動作パラメータ（生成側）。
#
# チャンネル運用設定（enabled / publish_time / 本数 / 投稿間隔など）は
# config/channel/shorts.json に置く。両者を混同しないこと。
#
# チャンネル側上書きは config/skills/short.yaml。

# Shorts ループ動画の既定 engine。fal は低コストの opt-in。
engine: veo

veo:
  model: "veo-3.1-fast-generate-001"
  default_prompt: |
    Gentle natural animation with a locked camera. Keep all text completely static and unchanged.

fal:
  model: "minimax/h3-max-turbo/image-to-video"
  allowed_models:
    - "minimax/h3-max-turbo/image-to-video"
    - "minimax/h3-max/image-to-video"
  duration_seconds: 8
  resolution: "768P"
  prompt_expansion_mode: balanced
  canvas:
    "9:16": [768, 1344]
  upscale_to: [1080, 1920]
  timeout_seconds: 600
  poll_interval_seconds: 2
  default_prompt: |
    Gentle natural animation with a locked camera. Keep all text completely static and unchanged.

collection:
  # generate-shorts.sh の env デフォルト
  duration_sec: 20          # 1 ショートあたりの尺
  fade_in_sec: 1.0          # フェードイン秒数
  fade_out_sec: 1.5         # フェードアウト秒数
  chapter_offset_sec: 30    # 各チャプター開始からのオフセット秒
  # drawtext で使うフォントパス（macOS デフォルト）
  font_path: "/System/Library/Fonts/Palatino.ttc"

release:
  crf: 18                   # 画質（小さいほど高品質）
  preset: slow              # x264 エンコーダプリセット
  audio_bitrate: "192k"     # AAC ビットレート
