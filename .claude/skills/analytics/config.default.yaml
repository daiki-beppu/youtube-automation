# analytics skill default config
#
# チャンネル側では `config/skills/analytics.yaml` に上書き値を置く。

# Analytics データと分析レポートの鮮度判定しきい値（分）。
freshness_minutes: 30

experiment:
  # pending 実験を評価するまでの最低日数。
  judge_after_days: 14
  # baseline 比で improved / worse とする inclusive の変化率。
  judge_threshold_percent: 20

win_pattern:
  # 先勝ちの名前付き正規表現。マッチしないタイトルは other。
  title_patterns:
    - name: question
      regex: "[?？]"
    - name: numbered
      regex: "(?:^|\\s)(?:vol(?:ume)?[.]?\\s*)?[0-9]+(?:\\s|$)"
    - name: duration_promise
      regex: "(?:[0-9]+\\s*(?:hour|hours|hr|hrs|時間)|[0-9]+:[0-9]{2})"

html:
  # ヘッダー直下に表示する KPI カード。表示順と枚数はこのリストで決まる。
  kpi_cards:
    - total_views
    - total_watch_time
    - subscribers
    - ctr
  # 動画パフォーマンス表・動画別推移から除外するタイトルキーワード。
  exclude_title_keywords:
    - "#Shorts"

theme:
  colors:
    background: "#0f1419"
    card_background: "#1a2332"
    accent: "#c8a96e"
    text: "#e8e6e3"
    chart_palette:
      - "#4ecdc4"
      - "#45b7d1"
      - "#96ceb4"
      - "#ffeaa7"
      - "#dfe6e9"
    success: "#00b894"
    warning: "#fdcb6e"
    danger: "#e17055"

# 公開済み動画の失速分析。旧 flop-analysis default と同じ値を維持する。
flop:
  thresholds:
    ratio_vs_median:
      strong: 0.5
      moderate: 0.7
      mild: 0.9
    neutral_band_pct: 10
  hypothesis_ratios:
    ctr_low: 0.7
    ctr_healthy: 0.9
    avd_low: 0.7
    impressions_low: 0.5
