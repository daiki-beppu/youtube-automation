prompt:
  # music --prompt default config
  #
  # SunoAI V5.5 用プロンプト生成の設定。チャンネル側で config/skills/music.yaml::prompt に上書き。

  # Suno ワークスペース名 (UI 表示用)
  workspace_name: ""

  # ジャンル・スタイル指定文 (Styles 欄に入る共通プレフィックス)
  # ボーカル要素 (vocals/rap/singing) が含まれる場合、suno スキルはボーカルモードで処理する
  genre_line: ""

  # Suno の Exclude Styles 欄に入れる除外語
  exclude_styles: ""

  # Style Influence (0-100、高いほどジャンル指定が強く反映される)
  style_influence: 50

  # Weirdness (0-100、高いほど予測不能な展開が増える)
  weirdness: 50

  # 歌詞構造の自動タグ付け ([Verse], [Chorus] 等を AI が自動挿入)
  auto_lyrics_structure: true

  # effective genre_line の hard guard (yt-suno-verify がエラーにする)
  style_char_limit: 120

  # 第1行 + 情景行からなる完成形 Style の soft quality budget
  # Suno v4.5 公式 Help の 256 文字例を収容する保守的な推奨値であり、platform hard limit ではない
  full_style_char_limit: 256

  # Style テキストに含めてはならないアーティスト名 (Suno ポリシー / ベストプラクティス)
  # 著名アーティスト名を Style に入れると生成がブロックされるか品質が低下する
  banned_artists:
    - Drake
    - Taylor Swift
    - The Weeknd
    - Beyonce
    - Kanye West
    - Eminem
    - Rihanna
    - Ed Sheeran
    - Ariana Grande
    - Justin Bieber
    - Billie Eilish
    - Post Malone
    - Dua Lipa
    - Bad Bunny
    - Travis Scott
    - BTS
    - Adele
    - Bruno Mars
    - Lady Gaga
    - Coldplay
    - Imagine Dragons
    - The Beatles
    - Pink Floyd
    - Led Zeppelin
    - Radiohead
    - Daft Punk
    - Aphex Twin
    - Boards of Canada
    - Nujabes
    - J Dilla

  # Model (V5.5 推奨)
  model: V5.5

  # スタイルバリアント (A/B テスト用、省略可)
  # 各パターンで style: <key> を指定すると variant 固有の genre_line が使われる
  # 代表ジャンル (lo-fi / ambient / piano / nature) の参考テンプレ — 実値は
  # `/audit --video --source benchmark` の `suno_preset.genre_line` を起点に
  # チャンネル側 config/skills/music.yaml::prompt で上書き推奨
  style_variants: {}
  # style_variants:
  #   lo-fi:
  #     name: "lo-fi jazz"
  #     genre_line: "lo-fi jazz, soft piano, warm rhodes, mellow drums, vinyl warmth"
  #   ambient:
  #     name: "ambient pad"
  #     genre_line: "ambient pad, soft synth, airy textures, sustained chords, subtle field recording"
  #   piano:
  #     name: "solo piano"
  #     genre_line: "solo piano, soft felt piano, intimate dynamics, gentle pedal sustain"
  #   nature:
  #     name: "nature acoustic"
  #     genre_line: "acoustic guitar, soft strings, nature ambience, gentle pulse, woody warmth"

  # スタイル戦略: mixed (1 コレクション内で混合) / single (統一)
  style_strategy: single

  # Style 自動バリエーション (#1456)
  # 同一コレクション内の entry ごとに texture / rhythm feel の descriptor を Style 第 1 行末尾へ
  # 決定的ローテーションで付与し、Suno V5.5 での楽曲同質化を防ぐ。genre_line のコアジャンルは変えない。
  # - 先頭 entry (通し番号 0) は descriptor なしの base style を維持する (コレクションの基準曲)
  # - 割り当ては entry の通し番号ベースで決定的 (再生成しても同じ結果)
  # - pattern に `style: <variant-key>` の明示 override がある entry には付与しない
  # - pools は axis 名 → descriptor 配列。チャンネル側 config/skills/music.yaml::prompt で axis 単位に丸ごと置換できる
  # - descriptor には禁止形容詞 (references/suno-examples.md) と雨音・環境音 NG ワードを入れないこと
  style_variation:
    enabled: true
    pools:
      texture:
        - warm rounded texture
        - soft airy texture
        - dusty mellow texture
        - smooth velvet texture
        - gentle hazy glow
        - deep woody warmth
        - quiet intimate closeness
        - bright open air
      rhythm:
        - laid-back rhythm feel
        - steady unhurried pulse
        - sparse relaxed groove
        - gentle flowing momentum
        - soft rolling swing
        - low-key driving pulse

  # インストモード: 曲数ベースの運用方針
  # - tracks_per_collection: 1 コレクションあたりの生成・期待 clip 数。Suno は 1 リクエスト = 2 曲生成のため、
  #   yaml `suno-patterns.yaml` の `patterns:` 配列には ceil(tracks_per_collection / 2) 個の entry を
  #   並べる。既定の 20 なら 10 entries → 20 clips を生成する。
  #   最終 playlist 採用数は下の duration_filter 適用後に減る場合がある。
  #   コレクション単位の上書きは `suno-patterns.yaml` の top-level `tracks:` キーで可能。
  # - pattern 概念は廃止: 各 entry は独立した情景フレーズで設計する (旧 4 パターン × 3 回生成は使わない)。
  tracks_per_collection: 20

  # Suno helper の Custom Duration へ渡す collection 共通の目標尺（秒）。
  # channel override に正の整数を明示した場合だけ全 prompt entry へ出力し、未設定時はキーを省略する。
  # 生成後 clip の採用範囲を決める duration_filter とは独立し、自動推定・同期しない。
  duration_sec: null

  # Suno helper の playlist 採用判定に使う collection 単位 duration guard（秒）。
  # 生成された clip がこの範囲外なら playlist 追加対象から除外される。
  duration_filter:
    min_sec: 60
    max_sec: 300

  # ボーカルモード専用: パターン運用方針 (インストモードでは無視される)
  # - 必要 pattern 数 ≈ track_count (1 pattern = 1 prompt entry = 1 採用曲。数%の試聴落選バッファを上乗せ)。
  #   インストの ceil(N/2) を類推適用しないこと (SKILL.md の計算式参照)。
  # - pattern_strategy: パターン運用の戦略名 (`mixed` = N パターンで起伏を作る / `single` = 1 パターン統合)。
  # - pattern_strategy_note: AI への運用補足 (任意の自由記述)。
  pattern_strategy: mixed
  pattern_strategy_note: ""

  # ボーカル歌詞本文の生成設定は同ファイルの `lyric` 節が所有する。
  # `/music --prompt` は Style / scene / title と `suno-lyrics.json` の merge のみを担当する。

lyric:
  # music --lyric default config
  #
  # 偉人の名言やテーマのエッセンスを骨格に Suno V5.5 歌詞を 1 曲ずつ生成するスキルの設定。
  # チャンネル側で config/skills/music.yaml::lyric に上書きする。

  # 名言ソース（iyashitour.com の英語名言ページ）
  # 安全境界: scheme=https / host=iyashitour.com。path は /meigen/ 配下（インデックス）に加え、
  # そこからリンクで辿る /archives/<ID>（英語名言の原文ページ）への 1 ホップのみ許可。
  # 別 host や private IP への自動取得は禁止し、人間が取得済み引用メモを渡す。
  source:
    base_url: "https://iyashitour.com"
    index_path: "/meigen/eigo_meigen/eigo_ijin"
    # 1 曲あたり何個の名言から選定するか
    fetch_candidates_per_track: 8
    # WebFetch のリトライ回数
    fetch_retries: 2
    # キャッシュ TTL（秒）。同一偉人ページの重複取得を抑制
    cache_ttl_sec: 900

  # 歌詞のターゲットペルソナ
  # `docs/channel/personas/persona-definition.md` が無い場合の fallback。
  # 旧 `docs/audience-persona.md` は legacy fallback としてのみ参照する。
  persona:
    primary: "Carla"
    secondary: "Marcus"
    tertiary: "Kenji"
    # 各曲のうち何割を primary 寄りで書くか（残りは secondary / tertiary に振る）
    primary_ratio: 0.7

  # ボーカル設定
  vocal_gender: "male"  # male / female / neutral / auto
  # auto は collections/planning/<theme>/01-thumbnail/main.png のキャラ性別から推定（要画像解析）

  # 歌詞生成
  lyrics_generation:
    # claude: skill 実行中に Claude が直接生成
    provider: claude
    # 検証 NG 時の最大再生成回数
    max_retries: 3

  # 偉人の重み付け（mood tag → 偉人候補リスト）
  # mood tag は suno-patterns.yaml::patterns[].mood または scene tag と一致させる
  affinity_weights:
    # 過去・郷愁・時の流れ
    nostalgia:
      - { name: "maya-angelou",        weight: 1.0 }
      - { name: "f-scott-fitzgerald",  weight: 0.9 }
      - { name: "hemingway",           weight: 0.8 }
      - { name: "hermann-hesse",       weight: 0.7 }
      - { name: "ray-bradbury",        weight: 0.6 }

    # 静かな自信・誇り
    confidence:
      - { name: "martin-luther-king",  weight: 1.0 }
      - { name: "nelson-mandela",      weight: 0.95 }
      - { name: "muhammad-ali",        weight: 0.85 }
      - { name: "maya-angelou",        weight: 0.8 }
      - { name: "churchill",           weight: 0.6 }

    # 愛・優しさ・親密さ
    romance:
      - { name: "shakespeare",         weight: 1.0 }
      - { name: "victor-hugo",         weight: 0.9 }
      - { name: "goethe",              weight: 0.85 }
      - { name: "saint-exupery",       weight: 0.8 }
      - { name: "pablo-neruda",        weight: 0.7 }

    # グルーヴ・自由・解放
    groove:
      - { name: "bob-marley",          weight: 1.0 }
      - { name: "john-lennon",         weight: 0.95 }
      - { name: "miles-davis",         weight: 0.9 }
      - { name: "louis-armstrong",     weight: 0.8 }
      - { name: "duke-ellington",      weight: 0.7 }

    # 内省・知恵・哲学
    reflection:
      - { name: "gandhi",              weight: 1.0 }
      - { name: "lincoln",             weight: 0.9 }
      - { name: "albert-camus",        weight: 0.85 }
      - { name: "dostoevsky",          weight: 0.75 }
      - { name: "tolstoy",             weight: 0.7 }

    # 夢・希望・未来志向
    dream:
      - { name: "walt-disney",         weight: 1.0 }
      - { name: "jfk",                 weight: 0.9 }
      - { name: "picasso",             weight: 0.85 }
      - { name: "van-gogh",            weight: 0.8 }
      - { name: "steve-jobs",          weight: 0.7 }

    # 楽しさ・陽気さ・good times
    good-times:
      - { name: "mark-twain",          weight: 1.0 }
      - { name: "oscar-wilde",         weight: 0.9 }
      - { name: "frank-sinatra",       weight: 0.85 }
      - { name: "elvis-presley",       weight: 0.75 }
      - { name: "bob-marley",          weight: 0.7 }

    # コーディング・集中・職人気質（Marcus 向け）
    focus:
      - { name: "leonardo-da-vinci",   weight: 1.0 }
      - { name: "steve-jobs",          weight: 0.95 }
      - { name: "albert-einstein",     weight: 0.85 }
      - { name: "picasso",             weight: 0.75 }
      - { name: "miles-davis",         weight: 0.7 }

  # 同じ偉人を 1 コレクション内で使う上限回数
  # 1 にすると完全分散、2-3 にすると人気偉人の重複を許容
  max_uses_per_great_person: 2

  # 歌詞構造ガイドライン（Suno V5.5 セクションタグ）
  lyric:
    format: "suno_v5_section_tags"
    language: "en"

    sections:
      # 必須セクション最小構成
      - { tag: "Verse",   count: 2, lines_min: 4, lines_max: 6 }
      - { tag: "Chorus",  count: 2, lines_min: 4, lines_max: 6 }
      # 以下から 1 つ挿入（多様性のため曲ごとに切替可）
      - { tag: "Bridge",            count: 1, lines_min: 2, lines_max: 4, optional_pool: true }
      - { tag: "Instrumental break", count: 1, lines: 0,                  optional_pool: true }

    # 押韻パターン候補（各 Verse/Chorus でランダム選択）
    rhyme_scheme:
      - "abab"
      - "aabb"
      - "abba"

    # テンポ別 1 行の単語数ガイド
    line_word_count_by_tempo:
      slow:   { min: 6, max: 8 }   # 80-95 BPM
      mid:    { min: 4, max: 7 }   # 95-110 BPM
      up:     { min: 3, max: 5 }   # 110+ BPM

    vocab_constraints:
      # 含めない語（AI 臭の代表例）
      avoid:
        - "yo"
        - "ay"
        - "uh"
        - "yeah yeah"
        - "let me tell ya"
        - "y'all"
        - "baby baby"
        - "oh oh oh"

      # 優先語（Carla 層向け語彙）
      prefer:
        - "smooth"
        - "soulful"
        - "midnight"
        - "memory"
        - "golden"
        - "quiet"
        - "pride"
        - "longing"
        - "time"
        - "stay"

  # 和訳設定（レビュー用・ニュアンス維持の意訳）
  # suno-lyrics.md にのみ載せる。Chrome 拡張用 JSON には含めない。
  translation:
    # 和訳を生成するか
    enabled: true
    # 翻訳の粒度: "section" (セクション単位の意訳・推奨) / "line" (行対訳・非推奨)
    granularity: "section"
    # ニュアンス維持の方針
    preserve:
      - "emotion_temperature"   # 感情の温度感
      - "scene_imagery"         # 情景・視覚イメージ
      - "persona_voice"         # ペルソナの語り口
      - "chorus_repetition"     # フックの反復性
    drop:
      - "rhyme"                 # 押韻は再現しない
      - "word_order"            # 英語の語順を引きずらない
      - "literal_meaning"       # 逐語訳的な「正確さ」は捨てる
    # 翻訳臭検出語（これらが混入したら NG）
    translation_smell_words:
      - "という意味"
      - "と歌う"
      - "と歌っている"
      - "Verse 1 では"
      - "Verse 2 では"
      - "Chorus は"
      - "ここで"
      - "つまり"
    # Carla 語彙の英→日マッピング（参考。LLM への hint）
    carla_vocab_jp:
      golden: "金色の / 黄金の"
      stay: "残る / 居続ける"
      quiet: "静かな"
      longing: "焦がれる / 恋しさ"
      midnight: "深夜 / 真夜中"
      memory: "記憶 / 思い出"
      slow: "ゆっくり / 緩やかな"
      pride: "誇り"
      feel: "感じる（feelings は「気持ち」より「感じたもの」寄り）"
      stay_chorus: "離れない / 残ったまま"
    # Chorus の和訳 1 行の文字数目安
    chorus_line_chars: { min: 6, max: 14 }

  # 禁止トピック
  forbidden_topics:
    - politics
    - religion
    - explicit
    - violence
    - brand-names
    - real-person-names  # 偉人名そのものを歌詞に出さない

  # CTA を歌詞に入れる場合の対象 entry name。空なら CTA は入れない。
  cta:
    positions: []

  # 出力先（collections/planning/<theme>/ からの相対パス）
  output:
    lyrics_md: "20-documentation/suno-lyrics.md"
    lyrics_json: "20-documentation/suno-lyrics.json"
    # 既存エントリを上書きしない（追記モード）
    preserve_existing: true

  # 検証ルール
  validation:
    # 名言原文との連続一致語数の上限（これを超えると直接転載として失格）
    max_consecutive_quote_words: 4
    # 必須セクションが揃っているか
    require_sections: ["Verse", "Chorus"]
    # 1 セクションあたりの最大行数を超えたら警告
    warn_section_overflow: true

generate:
  # music_engine=suno の生成既定値。旧 config/skills/suno-helper.yaml override と互換。
  suno:
    unattended:
      # 1 回の定期実行で新たに生成する entry 数。残りは resume checkpoint へ繰り越す。
      max_entries: 10
      # Suno に同時投入する Generate request 数（1 request = 2 clips）。
      max_concurrent_generations: 3
      # entry 単位の一時失敗を再試行する回数。
      max_retries: 2

  # music_engine=minimax の生成既定値。公式 API の instrumental hex response を使う。
  minimax:
    model: music-3.0
    duration_padding_min: 0
    request_timeout_sec: 360

  # music_engine=lyria の生成既定値。旧 config/skills/lyria.yaml override と互換。
  lyria:
    # lyria skill default config
    #
    # Vertex AI Lyria 3 (`interactions` endpoint) を呼んで音源を生成する設定。
    # チャンネル側で config/skills/lyria.yaml に上書き。
    #
    # Lyria 3 API は text / reference image / BPM / intensity / vocal-instrumental mode / lyrics
    # を受け取れる。reference_image は構造化入力、その他はプロンプトに自動合成される。
    # 1 リクエスト = 1 セグメント (~184 秒上限) で返るため、長尺は複数リクエストを連結する。
    # 下記 default_* はチャンネル共通値で、generate_music() 呼び出し時に個別上書き可能。

    # スキル無効化フラグ (true の場合 lyria スキルは /music --prompt を案内して終了)
    _disabled: false

    # 生成前のプロンプト・API パラメータ承認を省略する opt-in。
    # true でも採用値の文書保存と 60 segment hard cap は維持する。
    skip_generation_approval: false

    # Lyria モデル
    #   lyria-3-pro-preview  : 1 リクエストあたり最大約 184 秒（~3 分）生成。本生成用
    #   lyria-3-clip-preview : 30 秒固定。プレビュー用 (--preview で自動使用)
    model: lyria-3-pro-preview

    # プロンプト先頭に入れる共通ジャンル句 (最小限、楽器名・ムード語は入れない)
    # 推奨: "{genre} only, clean dry recording, no pads"
    prompt_prefix: ""

    # プロンプトに付与する補足スタイル句 (optional)
    # ジャンル・雰囲気の補足用。prompt 本体と一緒にモデルに送られる。
    style_hints: ""

    # セグメント間クロスフェード秒数（複数リクエストを連結する場合に使う）
    crossfade_sec: 5

    # プロンプトに使わない禁止語 (Claude がプロンプト設計時にチェック)
    ng_words:
      - ambient pads
      - ethereal choir
      - cinematic
      - orchestral
      - epic
      - synthesizer

    # タイミング余裕 (分) — total_duration_min = audio.target_duration_min + duration_padding_min
    duration_padding_min: 3

    # チャンネル共通の BPM / intensity / mode / 参照画像のデフォルト。
    # generate_music() 呼び出し時にチャンネル共通値として渡し、呼び出しごとに個別上書き可能。
    # null の場合は呼び出し側で個別指定する（または未指定）。

    # 目安 60-180。例: 90
    default_bpm: null

    # "low" | "medium" | "high" | null
    default_intensity: null

    # "instrumental" | "vocal" | null
    default_mode: null

    # コレクションルートからの相対パス文字列、または絶対パス。
    # 例: "10-assets/main.png" — textless 動画背景 / ビジュアル参照画像を自動採用
    default_reference_image: null

master:
  # music --master default config
  #
  # マスター音源生成 + Suno CDN ダウンロード + マスター整音の設定。
  # チャンネル側では config/skills/masterup.json を優先し、既存
  # config/skills/masterup.yaml は fallback として読む。

  audio:
    # トラック間クロスフェード秒数
    # uv run yt-generate-master の ffmpeg acrossfade と domains/metadata/service.py の
    # タイムスタンプ計算の両方がこの値を参照する。
    crossfade_duration: 1.0

    # マスター音源のビットレート (uv run yt-generate-master と uv run yt-finalize-master で共有)。
    # `audio.finalize.bitrate` が明示指定されていればそちらが uv run yt-finalize-master の出力に勝つ。
    bitrate: "192k"

    # 旧 channel override。config/channel/audio.json に target_duration_min がある場合は
    # そちらが SSOT となり、この値は警告付きで無視される。channel 側未設定時のみ、
    # CLI フラグ (`--loop` / `--target-duration`) 未指定時の互換 fallback として使われる。
    # 同梱デフォルトでは未設定 (= 1 ループで終了)。
    # target_duration_min: 120

    # CLI フラグ (`--shuffle` / `--shuffle-seed`) のいずれも未指定のときに
    # `uv run yt-generate-master --shuffle` 相当のデフォルトとして採用される。
    # Suno で同一プロンプトから生成した類似イントロ群が連続するのを避けたいときに有効化する。
    # 同梱デフォルトでは未設定 (= シャッフルしない)。チャンネル側で opt-in する。
    # shuffle: true

    # `audio.shuffle: true` のときに採用される再現性 seed (整数)。
    # CLI `--shuffle-seed` 未指定時のフォールバックとして使われる。
    # 単独設定 (`shuffle: true` を伴わない) では shuffle を有効化しない。
    # shuffle_seed: 42

    # CLI フラグ (`--pin-first` / `--pin-first-count`) のいずれも未指定のときに
    # `uv run yt-generate-master --pin-first-count N` 相当のデフォルトとして採用される。
    # ソート済み先頭 N 件を順序固定し、`audio.shuffle: true` と併用すると残りだけ
    # シャッフルされる。Suno で retention に強い 1 曲を冒頭に置きたい運用向け。
    # 既定 0 = 固定なし。
    pin_first_count: 0

    # uv run yt-finalize-master の整音パイプライン設定 (#512)。
    # branding/<dirname>/<glob> に該当ファイルが 1 件以上ある場合のみ有効。
    # 全項目に組み込みデフォルトがあり、未設定でも既存 v5.5.0 と同じ挙動になる。
    # finalize:
    #   # 出力エンコード (audio.bitrate / libmp3lame / ffmpeg 既定 sr を上書き)
    #   bitrate: "192k"            # 出力ビットレート (未指定なら audio.bitrate を流用)
    #   codec: "libmp3lame"        # ffmpeg -c:a に渡すコーデック
    #   sample_rate: 44100         # ffmpeg -ar に渡すサンプリングレート (未指定で master 由来)
    #
    #   ambient_layers:
    #     dirname: "rain_layers"   # branding/<dirname>/ 直下を探索
    #     glob: "rain_*.wav"       # <dirname>/ 内の対象ファイル glob
    #     volume_db: -19           # 全レイヤー共通の音量 dB
    #     fadein_s: 0.5            # 頭の不連続抑制 (afade)
    #     fadein_curve: "tri"      # afade の curve (tri/exp/log/qsin/hsin/esin/cub/squ/par 等)
    #     layers:                  # per-file 上書き (ファイル名 → 部分上書き dict)
    #       rain_001.wav:
    #         volume_db: -22        # この 1 ファイルだけ音量を下げる
    #       rain_002.wav:
    #         fadein_s: 1.5
    #         fadein_curve: "exp"
    #
    #   loudnorm:
    #     enabled: true            # false で pass1/pass2 を skip し amix 単発で encode
    #     mode: "linear"           # 'linear' (two-pass) のみサポート。'dynamic' は NotImplementedError
    #     I: -14                   # integrated loudness 目標 (LUFS)
    #     LRA: 11                  # loudness range 目標
    #     TP: -1.5                 # true peak 目標 (dBTP)
    #
    #   mix:
    #     duration: "first"        # ffmpeg amix duration (first/shortest/longest)
    #     normalize: 0             # ffmpeg amix normalize (0=disabled, 1=enabled, true/false 可)


  # Suno 1 Generate = 2 clip の採用整理。
  # /music --generate が全 clip を 02-Individual-music/ に配置した後、/music --master が
  # uv run yt-generate-master の直前に実行する。
  pair_selection:
    # auto: suno-prompts.json の lyrics から歌詞あり/なしを判定する。
    #   - 歌詞あり: 同名タイトル / prompt entry ごとに 1 clip だけ winner 採用
    #   - 歌詞なし: 同じ prompt から出た 2 clip を両方採用
    # never: 採用整理をスキップし、02-Individual-music/ 直下の音源をそのまま使う。
    mode: auto

    # winner 選定戦略。初版は random のみ。
    strategy: random
    # null なら実行ごとに seed を生成し、01-master/.selection.log に記録する。
    random_seed: null

    # 極端に短い曲 / 長い曲は master から除外する。
    # Suno の失敗生成（数秒で終わる、5 分超で崩れる等）を master に混ぜないための guard。
    # 既定 300 秒は YouTube 用 BGM collection に 5 分超の崩れた生成を混ぜないための guard。
    # チャンネル側では `config/skills/masterup.json` を優先し、既存
    # `config/skills/masterup.yaml` fallback で同じキーを明示的に上書きできる。
    # null で片側だけ無効化できる。
    min_song_sec: 45
    max_song_sec: 300
    out_of_range_action: stock # stock | delete

    selection_log_path: "01-master/.selection.log"

  stock:
    dir: "assets/stock/music/b-side"
    filename_template: "{collection_slug}__{song_id}__{title_slug}.{ext}"
    on_duplicate: skip # skip | overwrite | fail

  validation:
    loudness_deviation:
      # 02-Individual-music/ の全曲における integrated LUFS の最大差。
      # 2.0 LU 超は master 結合前に FAIL とし、明示承認まで停止する。
      max_lu: 2.0

  # raw master への雨レイヤー後処理 (opt-in / uv run yt-apply-rain-layers が参照)
  #
  # `uv run yt-finalize-master` (audio.finalize namespace) が master.mp3 を loudnorm 二段で
  # in-place 上書きするのに対し、こちらは raw master (master.mp3) と
  # `branding/rain_layers/*.wav` を amix で合成して別ファイル (master-rain.wav)
  # に書き出す軽い後処理。後段で外部 DAW のミキシング+マスタリングを挟む運用向け。
  # 成功時に workflow-state.json の assets.raw_master を output_name へ切り替える。
  #
  post_processing:
    suno_audio_cleanup:
      enabled: true               # 既定 ON。false で Suno DL 後の個別音源 cleanup を無効化
      max_workers: 2              # apply の曲単位最大並列数 (1〜8)。CLI --jobs が優先
      backup_originals: true      # 02-Individual-music/originals-pre-cleanup/ に元ファイルを保存
      bitrate: "192k"             # libmp3lame 出力ビットレート (未指定なら audio.bitrate)
      codec: "libmp3lame"
      trim_silence:
        enabled: true             # 冒頭無音を silenceremove でカット
        threshold_db: -50
      eq:
        enabled: true             # 350Hz のもやつき / 8kHz 以上のシャリつきを軽く抑える
        muddiness_freq_hz: 350
        muddiness_gain_db: -2
        harshness_freq_hz: 8000
        harshness_gain_db: -1.5
      volume_smoothing: true      # dynaudnorm で曲中の音量ムラを緩和
      limiter:
        enabled: true             # alimiter で瞬間ピークを抑制
        limit: 0.95
      loudnorm:
        enabled: true             # YouTube 向け LUFS 正規化
        I: -14
        LRA: 11
        TP: -1.5
      tail_fade_guard:
        enabled: true             # 後半崩れ対策として末尾に短い fade-out guard を入れる
        fade_sec: 3

    # rain_layers:
  #     enabled: false              # opt-in (true にしないと uv run yt-apply-rain-layers は何もしない)
  #     volume_db: -19              # 各レイヤーに当てる減衰 dB (10^(-19/20) ≈ 0.112)
  #     output_name: master-rain.wav # 出力ファイル名 (01-master/ 配下)
  #     output_codec: pcm_s16le      # 出力 ffmpeg コーデック (PCM 16-bit)
    #   output_sample_rate: 44100    # 出力サンプリングレート (Hz) / stereo 固定
