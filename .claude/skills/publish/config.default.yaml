# publish skill default config
#
# 公開工程の mode 別設定。
# チャンネル側では `config/skills/publish.yaml::<mode>` に上書き値を置く。
#
# 注意: `status.selfDeclaredMadeForKids` / `status.containsSyntheticMedia` は
# `config/channel/youtube.json` の `self_declared_made_for_kids` / `contains_synthetic_media`
# （チャンネル config）が単一ソースのため、ここには置かない。

# アップロード前の存在チェック（AI が Step「前提条件チェック」で使う探索パターン）
upload:
  preflight:
  # マスター動画の探索 glob（順に評価し、最初に見つかったものを使用）
    master_video_globs:
      - "01-master/*.mp4"
      - "03-Individual-movie/*master*.mp4"
  # アップロード用サムネイルの候補順（main.png/jpg は textless 動画背景なので含めない）
    thumbnail_candidates:
      - "10-assets/thumbnail.jpg"
      - "10-assets/thumbnail.png"

# メタデータ基準（AI がタイトル・概要欄の確認時に検査する）
  metadata:
  # 避けるべき誇張語。CTR とチャンネルブランドの信頼性を損なうため使用しない
    banned_exaggeration_words:
      - Epic
      - Ultimate

# community mode デフォルト設定（プレースホルダ）
#
# この section はドキュメント用途。実行時に読み込まれるのは
# downstream チャンネルリポジトリ側の `config/channel/community.json`。
# チャンネル開設時は `examples/channel_config.example/community.example.json`
# をコピー → `config/channel/community.json` に配置し、テンプレ文面と
# studio_url を自チャンネル向けに書き換える。
#
# Flow365 TTP の前提:
#   - 完全固定テンプレ（動画 1 本 = 投稿 1 本）
#   - 変数展開なし（ブランドボイスの反復刷り込みが狙い）
#   - macOS 専用（pbcopy / open）
community:
  # --------------------------------------------------------------------
  # テンプレ本文（5 ブロック構造の例）
  # --------------------------------------------------------------------
  # 1. オープニングフック（絵文字 + 「New session is live.」相当）
  # 2. ジャンル/コンセプト一行
  # 3. リスナーへの感謝とブランドボイス（discipline / focus 等）
  # 4. アクションを促す短いコール
  # 5. クロージング（Press play 等）
  template: |
    🎧 New session is live.

    {brand_concept_oneliner}

    Appreciate everyone showing up every day with {brand_name}. {brand_voice_sentence}

    {call_to_action}

    ▶ {closing_line}

  # --------------------------------------------------------------------
  # YouTube Studio のコミュニティ投稿作成ページ URL
  # --------------------------------------------------------------------
  # 自チャンネルの channel_id を埋める。例:
  #   https://www.youtube.com/channel/UCxxxxxxxxxxxxxxxxxxxxxx/posts
  studio_url: "https://www.youtube.com/channel/{channel_id}/posts"

  # --------------------------------------------------------------------
  # 動画添付のリマインド表示（自動添付は API 制約で不可）
  # --------------------------------------------------------------------
  attach_video: true

# clean mode デフォルト設定
#
# `collections/live/<id>/` からの相対 glob。チャンネル側では
# `config/skills/publish.yaml::clean` に上書きし、リストは丸ごと置換する。
clean:
  # YouTube に存在する、または再生成可能な削除対象
  delete_patterns:
    - "01-master/master.mp3"
    - "01-master/master-mix.wav"
    - "01-master/*-Master.mp4"
    - "02-Individual-music/*.mp3"
    - "10-assets/loop_normalized.mp4"

  # DistroKid提出完了済みのときだけ追加するdisc音声コピー
  distrokid_audio_patterns:
    - "30-distrokid/*/*.mp3"

  # delete_patterns と重なった場合も必ず保護する成果物
  protect_patterns:
    - "workflow-state.json"
    - "10-assets/main.png"
    - "10-assets/main.jpg"
    - "10-assets/thumbnail.jpg"
    - "10-assets/thumbnail.png"
    - "10-assets/loop.mp4"
    - "20-documentation/*"
    - "30-distrokid/spec.json"
    - "30-distrokid/*/metadata.md"
    - "30-distrokid/cover_art_3000.jpg"
    - "30-distrokid/README.md"
