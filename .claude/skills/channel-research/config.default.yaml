# channel-research skill default config
#
# 公開 skill の mode ごとに節を分ける。下流 override は移行完了まで
# config/skills/benchmark.yaml / discover-competitors.yaml の旧キーを維持する。

benchmark:
  # チャンネルあたりの走査プール本数（直近 N 投稿）
  scan_recent: 150
  # ベンチマーク対象とする視聴数しきい値
  min_views: 10000
  # レポート鮮度（日）
  freshness_days: 3
  # Gemini API によるサムネイル分析（既定 OFF）
  gemini_thumbnail_analysis: false
  thumbnail_analysis:
    model: gemini-3.5-flash
    delay_sec: 5
    prompt: |
      Analyze this YouTube thumbnail for a music channel.
      Return ONLY valid JSON (no markdown, no code fences):
      {
        "composition": "brief description of layout, focal points, and character positioning",
        "color_palette": "dominant colors and overall mood/tone",
        "text_placement": "how title text is positioned and styled",
        "character_activity": "what the character is doing (or 'none' if no character)",
        "atmosphere": "overall mood, lighting, and environmental effects",
        "strengths": ["list", "of", "effective", "elements"]
      }

discover:
  search:
    min_subscribers: 0
    max_subscribers: 10000000
    posted_within_days: 30
    top: 20
    per_keyword: 20
  keywords:
    recommended_min: 3
    recommended_max: 5
    hard_max: 8
