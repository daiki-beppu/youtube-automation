# video skill default config

generate:
  # 背景として優先する動画タイプ。loop は loop.mp4 を使い、不在時は static fallback。
  video_type: loop

  review:
    # true のとき全尺生成前に20秒previewのWeb承認を必須にする。
    preview_required: false

  audio:
    # 動画長を音声尺と分離するときの動画側ターゲット尺（分）。
    # target_video_duration_min: 120

  video:
    # effect=none の静止画を短尺ベイクして stream copy で繰り返す設定。
    still_fps: 1
    still_crf: 28
    still_gop: 300

describe:
  # チャプター（タイムスタンプ列）生成の有効 / 無効。
  # false ではタイムスタンプ列、重複トラック名の LLM リネーム、
  # workflow-state.json への track_display_names 永続化を skip する。
  chapters_enabled: true

  # 概要欄セクションの装飾ヘッダー。
  section_headers:
    track_list: "⎯⎯⎯⎯ ✦ Track List ✦ ⎯⎯⎯⎯"
    usage_attribution: "📝 Usage & Attribution:"
    perfect_for: "🎮 Perfect for:"
    channel_link_template: "🔗 {channel_name}:"
    theme_inline:
      prefix: "── "
      suffix: " ──"

  usage_attribution_lines:
    - "• This music is original AI composition"
    - "• Free to use for personal & commercial projects"
    - "• Attribution appreciated but not required"
    - "• Redistribution as-is prohibited"

  # テーマ→Perfect for 用途マッピング。未マッチ時は
  # config/channel/content.json の descriptions.perfect_for を使う。
  perfect_for_themes: {}

  theme_emoji:
    study: "📚"
    sleep: "🌙"
    tavern: "🍺"
    ocean: "🌊"
    forest: "🌿"
    druid: "🔮"
    rain: "🌧️"
    hearth: "🔥"

  cards:
    enabled: true
    timing: "12:00"
    text_template: "Up next from {channel_name}"
