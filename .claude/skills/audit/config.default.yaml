video:
  # audit --video default config
  #
  # Gemini で YouTube 動画を直接解析するスキル (Issue #103) の動作パラメータ。
  # チャンネル側では config/skills/audit.yaml::video に上書き値を置く。

  # Gemini モデル名 (動画入力対応モデルを指定)
  model: gemini-3.5-flash

  # static は冒頭クリップ窓、agentic はモデル主導で全尺を探索する。
  # agentic は Gemini 3.7 Flash / 3.6 Flash / 3.5 Flash-Lite のみ対応。
  processing: static

  # API レート制限対策の動画間ウェイト (秒)
  delay_sec: 10

  # 解析対象のクリップ窓 (秒)。動画冒頭からこの秒数だけを Gemini に渡す。
  # BGM チャンネルの長尺 Complete Collection は 1〜3 時間あるが、
  # 視聴継続を左右する hook_structure / thumbnail_alignment の評価対象を
  # 冒頭のフックに集中させるため、既定 30 秒に絞ってコストを抑える。
  # 曲数が多い・イントロが長いチャンネルは config/skills/audit.yaml::video で上書き可。
  analysis_window_sec: 30

  # Gemini に渡すプロンプト。チャンネルのジャンル/世界観に合わせて
  # config/skills/audit.yaml::video で上書きを推奨。
  #
  # 出力 JSON はトップレベルにジャンル横断のドメインキーを置き、CLI 側で
  # video_id / slug / url / title / analyzed_at / model を後付けする。
  #
  # `suno_preset` は SunoAI プロンプト生成 (`/music --prompt`) の初期推奨値として
  # `yt-generate-suno` が config/skills/music.yaml::prompt 空欄時の fallback で参照する。
  prompt: |
    Analyze this YouTube video as a music channel content audit, following the analysis scope above.
    Return ONLY valid JSON (no markdown, no code fences) with this exact shape:
    {
      "hook_structure": {
        "intro_sec": <number>,
        "first_text_at": <number>,
        "cuts_in_first_30s": <number>,
        "signature_elements": ["list", "of", "visual", "elements", "shown", "in", "first 30s"]
      },
      "bgm_arc": {
        "intro": "timestamp range (e.g. 0:00-0:15)",
        "peak": "timestamp of the highest-energy moment within the analysis scope",
        "outro": "timestamp range of the final section within the analysis scope",
        "energy_curve": "brief description of dynamics within the analysis scope",
        "segments": [
          {
            "start": "M:SS",
            "end": "M:SS",
            "track": "visible title if known, otherwise track N",
            "description": "instruments, mood, and energy in this segment"
          }
        ]
      },
      "scene_timeline": [
        {"start": "0:00", "summary": "one-line description of what changes (analysis scope only)"}
      ],
      "thumbnail_alignment": {
        "signature_present": <bool>,
        "color_palette_match": <bool>,
        "notes": "what was promised by thumbnail vs delivered in the analysis scope"
      },
      "editing_metrics": {
        "avg_cut_sec": <number, averaged over the analysis scope>,
        "text_per_min": <number, averaged over the analysis scope>,
        "transition_style": "brief description"
      },
      "suno_preset": {
        "genre_line": "comma-separated music style phrases (5-8 phrases summarizing observed BGM instruments, tempo, and mood at a granularity Suno can reproduce — e.g. 'lo-fi jazz, soft piano, warm rhodes, mellow drums, vinyl warmth')",
        "exclude_styles": "comma-separated words SunoAI tends to mis-add but which are absent from this video (e.g. 'heavy metal, EDM, dubstep, techno, vocals, rain sounds')",
        "rationale": "1-2 sentences grounded in bgm_arc — must not contradict observed dynamics"
      }
    }

metadata:
  # REMOTE チェック: YouTube 側 description のタイムスタンプ行数がこの値を超えたら
  # variation expansion regression として issue 化する。
  # チャンネル側では config/skills/audit.yaml::metadata で上書きできる。
  chapters:
    remote_max: 12
